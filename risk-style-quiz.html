<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131f"><title>How Do You Handle Risk at Tidefall? | Tidefall</title><meta name="description" content="Take the Tidefall risk style quiz and discover whether you are Bold, Calculated, Cautious or Adaptive."><link rel="canonical" href="https://www.tidefall.com.au/risk-style-quiz"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px 90px;background:#07131f;color:#fff}.shell{width:min(920px,100%);margin:auto}.card{padding:32px;border:1px solid #ffffff20;border-radius:24px;background:#ffffff08}.answers{display:grid;gap:12px}.answer{padding:17px;border:1px solid #ffffff20;border-radius:15px;background:#ffffff08;color:white;text-align:left;cursor:pointer}.hidden{display:none}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.box{padding:16px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff06}@media(max-width:650px){.split{grid-template-columns:1fr}}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">DECISION INSTINCTS</p><h1>How Do You Handle Risk at Tidefall?</h1><section id="q" class="card"><p id="num"></p><h2 id="qt"></h2><div id="a" class="answers"></div></section><section id="r" class="card hidden"><p class="eyebrow">YOUR RISK STYLE</p><h2 id="rn"></h2><p id="rc"></p><div id="detail" class="split"></div><p><button id="again" class="button primary">Take it again</button> <a class="button outline" href="/survive">Survival Game</a></p></section></div></main><script>const meta={Bold:['You move early and accept uncertainty when the reward matters.','Strength: momentum','Watch out for: acting before enough information'],Calculated:['You weigh outcomes and commit once the numbers feel good enough.','Strength: judgement','Watch out for: over-planning'],Cautious:['You protect against avoidable mistakes and prefer information before action.','Strength: safety','Watch out for: waiting too long'],Adaptive:['You do not marry one plan. You read what changes and keep adjusting.','Strength: flexibility','Watch out for: changing direction too often']};const qs=[['A corridor changes shape behind you.',[['Keep going forward',{Bold:3,Adaptive:1}],['Work out which route is safest',{Calculated:3}],['Stop and test the corridor',{Cautious:3}],['Change direction based on what it does next',{Adaptive:3}]]],['An unknown spell appears.',[['Try the smallest version',{Bold:2,Calculated:1}],['Research likely effects',{Calculated:3}],['Do not use it yet',{Cautious:3}],['Test the environment around it first',{Adaptive:3}]]],['Your friend wants to take a shortcut.',[['Sure, go',{Bold:3}],['Only if the payoff is worth it',{Calculated:3}],['Use the known route',{Cautious:3}],['Try it, but keep an exit plan',{Adaptive:3}]]],['The Tide starts pulling harder.',[['Push through',{Bold:3}],['Estimate whether resistance is worth it',{Calculated:3}],['Get stable first',{Cautious:3}],['Change angle and see what works',{Adaptive:3}]]],['A door says DO NOT OPEN.',[['Open it',{Bold:3}],['Find out why first',{Calculated:2,Cautious:1}],['Leave it closed',{Cautious:3}],['Check for another entrance',{Adaptive:3}]]],['You have incomplete information.',[['Act with what you know',{Bold:3}],['Rank the likely outcomes',{Calculated:3}],['Get more information',{Cautious:3}],['Take a reversible step',{Adaptive:3}]]],['A plan becomes dangerous.',[['Push if the goal matters',{Bold:3}],['Recalculate the risk',{Calculated:3}],['Abort',{Cautious:3}],['Pivot immediately',{Adaptive:3}]]],['What feels worst?',[['Missing the chance',{Bold:3}],['Making a dumb decision',{Calculated:3}],['Getting hurt unnecessarily',{Cautious:3}],['Being trapped in one option',{Adaptive:3}]]],['Pick a motto.',[['Go before the window closes',{Bold:3}],['Know the odds',{Calculated:3}],['Check twice',{Cautious:3}],['Keep an exit route',{Adaptive:3}]]],['Final choice.',[['Leap',{Bold:3}],['Measure',{Calculated:3}],['Wait',{Cautious:3}],['Adjust',{Adaptive:3}]]]];let i=0,s={Bold:0,Calculated:0,Cautious:0,Adaptive:0};function draw(){num.textContent=`Question ${i+1} of ${qs.length}`;qt.textContent=qs[i][0];a.innerHTML='';qs[i][1].forEach(([label,p])=>{const b=document.createElement('button');b.className='answer';b.textContent=label;b.onclick=()=>{Object.entries(p).forEach(([k,v])=>s[k]+=v);i++;i<qs.length?draw():finish()};a.appendChild(b)})}function finish(){q.classList.add('hidden');r.classList.remove('hidden');const e=Object.entries(s).sort((a,b)=>b[1]-a[1]);const w=e[0][0];rn.textContent=w.toUpperCase();rc.textContent=meta[w][0];detail.innerHTML=`<div class="box">${meta[w][1]}</div><div class="box">${meta[w][2]}</div>`;localStorage.setItem('tidefall-risk-style',w)}again.onclick=()=>{i=0;s={Bold:0,Calculated:0,Cautious:0,Adaptive:0};r.classList.add('hidden');q.classList.remove('hidden');draw()};draw();</script></body></html>
