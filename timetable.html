<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidefall Timetable Generator</title><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:#fff}.shell{width:min(900px,100%);margin:auto}.grid{display:grid;gap:12px}.slot{padding:18px;border:1px solid #ffffff22;border-radius:16px;background:#ffffff08}.time{opacity:.55;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">ACADEMY DAY</p><h1>Generate Your Timetable</h1><div id="grid" class="grid"></div><button id="gen" class="button primary" style="margin-top:18px">Generate timetable</button></div></main><script>const subjects=['Tide Theory','Spell Control','Riptide Training','History of the Academy','Magical Ethics','Water Navigation','Creature Studies','Defensive Magic','Hidden Architecture','Selari'];const times=['8:30','9:35','10:55','12:00','1:35','2:40'];function make(){const shuffled=[...subjects].sort(()=>Math.random()-.5).slice(0,6);grid.innerHTML=shuffled.map((x,i)=>`<div class="slot"><span class="time">${times[i]}</span><h2>${x}</h2></div>`).join('');localStorage.setItem('tidefall-timetable','1')}gen.onclick=make;make();</script></body></html>
