<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What Type of Riptide Player Are You? | Tidefall</title><link rel="stylesheet" href="styles.css"><style>body{margin:0;background:#07131f;color:#fff}.p{padding:120px 20px;min-height:100svh}.s{max-width:850px;margin:auto}.card{padding:28px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08}.a{display:grid;gap:10px}.a button{padding:15px;border:1px solid #ffffff22;border-radius:14px;background:#ffffff08;color:#fff;text-align:left}.hidden{display:none}</style></head><body><main class="p"><div class="s"><p class="eyebrow">RIPTIDE PROFILE</p><h1>What Type of Riptide Player Are You?</h1><section id="q" class="card"><p id="n"></p><h2 id="t"></h2><div id="a" class="a"></div></section><section id="r" class="card hidden"><h2 id="w"></h2><p id="c"></p><button class="button primary" onclick="location.reload()">Again</button></section></div></main><script>const types={Striker:'You chase openings and points. Fast decisions suit you.',Keeper:'You read danger early and protect the goal.',Playmaker:'You create space, connect teammates and control tempo.',Dolphin:'You are the wildcard. If a dolphin appears, everyone suddenly has to react to you.'};const Q=[['The ball reaches you near goal.',[['Shoot immediately','Striker'],['Look for a teammate','Playmaker'],['Reset possession','Keeper'],['Look for a dolphin lane','Dolphin']]],['Your team is losing.',[['Take more shots','Striker'],['Slow the other team down','Keeper'],['Change the passing pattern','Playmaker'],['Try something ridiculous','Dolphin']]],['Best skill?',[['Accuracy','Striker'],['Reflexes','Keeper'],['Vision','Playmaker'],['Nerve','Dolphin']]],['You have one defender ahead.',[['Beat them directly','Striker'],['Hold and wait','Keeper'],['Draw them out then pass','Playmaker'],['Use the water around them','Dolphin']]],['Dolphin appears.',[['Keep attacking','Striker'],['Track the threat','Keeper'],['Set up a ride chance','Playmaker'],['THAT IS MINE','Dolphin']]],['Your teammate panics.',[['Demand the ball','Striker'],['Cover them','Keeper'],['Give them an easy pass','Playmaker'],['Distract everyone with chaos','Dolphin']]],['Pick a role.',[['Finisher','Striker'],['Goalkeeper','Keeper'],['Midfield organiser','Playmaker'],['Specialist rider','Dolphin']]],['Final seconds.',[['Take the shot','Striker'],['Protect the lead','Keeper'],['Create the best chance','Playmaker'],['Go for the impossible play','Dolphin']]]];let i=0,s={Striker:0,Keeper:0,Playmaker:0,Dolphin:0};function draw(){n.textContent=`QUESTION ${i+1} OF ${Q.length}`;t.textContent=Q[i][0];a.innerHTML='';Q[i][1].forEach(([l,k])=>{let b=document.createElement('button');b.textContent=l;b.onclick=()=>{s[k]+=2;i++;i<Q.length?draw():finish()};a.appendChild(b)})}function finish(){q.classList.add('hidden');r.classList.remove('hidden');let x=Object.entries(s).sort((a,b)=>b[1]-a[1])[0][0];w.textContent=x.toUpperCase();c.textContent=types[x];localStorage.setItem('tidefall-riptide-player',x)}draw();</script></body></html>
