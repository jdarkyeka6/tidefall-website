<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131f"><title>What Would You Do? | Tidefall</title><meta name="description" content="Take the Tidefall decision test and see what kind of choices you make under pressure."><link rel="canonical" href="https://www.tidefall.com.au/decision-test"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px 90px;background:radial-gradient(circle at 50% 0%,rgba(70,125,150,.18),transparent 33%),#07131f;color:#fff}.shell{width:min(920px,100%);margin:auto}.hero{text-align:center}.hero h1{font-family:Cinzel,serif;font-size:clamp(3rem,7vw,5.6rem);margin:8px 0}.hero p{max-width:720px;margin:auto;opacity:.68;line-height:1.7}.card{margin-top:28px;padding:clamp(24px,5vw,44px);border:1px solid #ffffff20;border-radius:26px;background:#ffffff08}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.answer{padding:17px;border:1px solid #ffffff20;border-radius:15px;background:#ffffff08;color:#fff;text-align:left;cursor:pointer}.answer:hover{background:#ffffff12}.hidden{display:none}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.chip{padding:8px 12px;border:1px solid #ffffff22;border-radius:99px;background:#ffffff08}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}@media(max-width:680px){.answers{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">◌</span><span>TIDEFALL</span></a><nav class="nav-links"><a href="/explore">Explore</a><a href="/">Home</a></nav></header><main class="page"><div class="shell"><section class="hero"><p class="eyebrow">THE TIDE WATCHES WHAT YOU CHOOSE</p><h1>What Would You Do?</h1><p>Twelve situations. No right answers. This one is about your decision style, not whether the Academy lets you keep all your limbs attached.</p></section><section id="quiz" class="card"><p id="num" class="eyebrow"></p><h2 id="question"></h2><div id="answers" class="answers"></div></section><section id="result" class="card hidden"><p class="eyebrow">YOUR DECISION STYLE</p><h2 id="title"></h2><div id="chips" class="chips"></div><p id="copy"></p><div class="actions"><button id="again" class="button primary">Take it again</button><a class="button outline" href="/explore">Back to Explore</a></div></section></div></main><script>const styles={Protector:{copy:'You make choices around people first. You will accept inconvenience or risk if it keeps someone else from being left behind.',chips:['Loyal','People-first','Steady']},Analyst:{copy:'You want to understand the situation before committing. You trust evidence, patterns and good questions more than panic.',chips:['Observant','Careful','Strategic']},Explorer:{copy:'You are drawn toward the unknown. You are willing to trade certainty for discovery, especially when something feels important or strange.',chips:['Curious','Bold','Open-minded']},Driver:{copy:'You hate paralysis. When things stall, you create motion, make a call and adjust while moving.',chips:['Decisive','Adaptable','Energetic']}};const qs=[['A door opens where there was no door yesterday.',['Get someone before entering','Inspect it carefully','Go through before it closes','Mark it and make a plan']],['A friend is being blamed for something.',['Stand beside them immediately','Ask what actually happened','Find the missing piece','Push everyone to solve it instead of arguing']],['You have one minute to choose a route.',['Pick the safest for everyone','Use the evidence available','Choose the strange route','Choose quickly and commit']],['A teacher gives an unclear warning.',['Make sure everyone heard it','Ask for specifics','Wonder what they are not saying','Act on the useful part']],['You find a key with no label.',['Keep it safe','Study its marks','Try to learn what it opens','Test likely doors']],['Your group freezes during a crisis.',['Check who needs help','Work out what changed','Look for an unexpected option','Give everyone jobs']],['A plan works, but something feels wrong.',['Keep the group together','Recheck assumptions','Follow the feeling','Finish then reassess']],['You hear a rumour about a hidden room.',['Bring someone trusted','Find evidence first','Start looking','Work out the fastest search']],['Someone panics.',['Stay with them','Figure out the trigger','Change the environment','Give them one clear next step']],['You are offered forbidden knowledge.',['Think who could be affected','Ask why it was forbidden','Read it','Decide whether it is useful']],['The Tide pulls in two directions.',['Hold onto someone','Observe both currents','Test one carefully','Choose and move']],['Pick a sentence.',['Nobody gets left behind.','There is a reason. Find it.','I need to know what is there.','Standing still is also a choice.']]];const map=[['Protector','Analyst','Explorer','Driver'],['Protector','Analyst','Explorer','Driver'],['Protector','Analyst','Explorer','Driver'],['Protector','Analyst','Explorer','Driver'],['Protector','Analyst','Explorer','Driver'],['Protector','Analyst','Explorer','Driver'],['Protector','Analyst','Explorer','Driver'],['Protector','Analyst','Explorer','Driver'],['Protector','Analyst','Explorer','Driver'],['Protector','Analyst','Explorer','Driver'],['Protector','Analyst','Explorer','Driver'],['Protector','Analyst','Explorer','Driver']];let i=0,s={Protector:0,Analyst:0,Explorer:0,Driver:0};function draw(){num.textContent=`QUESTION ${i+1} OF ${qs.length}`;question.textContent=qs[i][0];answers.innerHTML='';qs[i][1].forEach((label,j)=>{const b=document.createElement('button');b.className='answer';b.textContent=label;b.onclick=()=>{s[map[i][j]]++;i++;i<qs.length?draw():finish()};answers.appendChild(b)})}function finish(){quiz.classList.add('hidden');result.classList.remove('hidden');const max=Math.max(...Object.values(s));const winner=Object.keys(s).filter(k=>s[k]===max)[0];localStorage.setItem('tidefall-decision-style',winner);title.textContent=winner.toUpperCase();chips.innerHTML=styles[winner].chips.map(x=>`<span class="chip">${x}</span>`).join('');copy.textContent=styles[winner].copy}again.onclick=()=>{i=0;s={Protector:0,Analyst:0,Explorer:0,Driver:0};result.classList.add('hidden');quiz.classList.remove('hidden');draw()};draw();</script></body></html>
