<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Emoji Riddles | Tidefall</title><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:#fff;text-align:center}.shell{width:min(760px,100%);margin:auto}.card{padding:30px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08}.emoji{font-size:4rem;margin:18px}.choices{display:grid;gap:12px}.choice{padding:16px;border:1px solid #ffffff22;border-radius:14px;background:#ffffff08;color:#fff;cursor:pointer}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">EMOJI CURRENT</p><h1>Guess the Tidefall Thing</h1><section class="card"><p id="n"></p><div id="emoji" class="emoji"></div><div id="choices" class="choices"></div><p id="score"></p></section></div></main><script>const qs=[['🌊🏰','Tidefall Academy',['Tidefall Academy','Riptide','Brannor']],['🐬⚽','Riptide',['Riptide','Calyx','Spell Trial']],['🗝️🌊','Ava’s key',['Ava’s key','Jasper’s necklace','Hidden corridor']],['🎙️✨','Voice magic',['Voice magic','Riptide','Dorms']],['🌊❓','The Choosing Tide',['The Choosing Tide','Nocten','Academy map']]];let i=0,s=0;function draw(){if(i>=qs.length){n.textContent='COMPLETE';emoji.textContent='🌊';choices.innerHTML='';score.textContent=`${s}/${qs.length}`;localStorage.setItem('tidefall-emoji-riddle','1');return}const x=qs[i];n.textContent=`Puzzle ${i+1} of ${qs.length}`;emoji.textContent=x[0];choices.innerHTML='';x[2].forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>{if(o===x[1])s++;i++;draw()};choices.appendChild(b)});score.textContent=`Score ${s}`}draw();</script></body></html>
