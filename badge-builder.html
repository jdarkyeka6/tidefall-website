<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidefall Badge Builder | Tidefall</title><link rel="stylesheet" href="styles.css"><style>body{margin:0;background:#07131f;color:#fff}.p{padding:120px 20px}.s{max-width:850px;margin:auto;text-align:center}.card{padding:32px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid button{padding:14px;border:1px solid #ffffff22;border-radius:14px;background:#ffffff08;color:#fff}.badge{margin:28px auto 14px;width:210px;height:210px;border-radius:50%;display:grid;place-items:center;border:2px solid #ffffff55;background:radial-gradient(circle,#ffffff18,#ffffff05);font-family:Cinzel,serif;padding:20px;box-sizing:border-box}.small{opacity:.65}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="p"><div class="s"><p class="eyebrow">ACADEMY HONOURS</p><h1>Build Your Tidefall Badge</h1><section class="card"><p>Pick a core value.</p><div id="values" class="grid"></div><p>Pick a symbol.</p><div id="symbols" class="grid"></div><div class="badge"><div><div id="icon" style="font-size:3rem">◌</div><strong id="name">UNFORGED</strong><div id="motto" class="small"></div></div></div><button id="save" class="button primary">Save badge</button><p id="msg"></p></section></div></main><script>const vals=[['Courage','Face the current'],['Curiosity','Ask what changed'],['Patience','Wait, then move'],['Resolve','Hold your course'],['Loyalty','No one left behind'],['Strategy','See three moves ahead']];const syms=[['🌊','Wave'],['🔑','Key'],['✦','Star'],['🧭','Compass'],['🛡️','Shield'],['🐬','Dolphin']];let v=vals[0],s=syms[0];vals.forEach(x=>{let b=document.createElement('button');b.textContent=x[0];b.onclick=()=>{v=x;render()};values.appendChild(b)});syms.forEach(x=>{let b=document.createElement('button');b.textContent=x[0]+' '+x[1];b.onclick=()=>{s=x;render()};symbols.appendChild(b)});function render(){icon.textContent=s[0];name.textContent=(v[0]+' '+s[1]).toUpperCase();motto.textContent=v[1]}render();save.onclick=()=>{localStorage.setItem('tidefall-badge',JSON.stringify({value:v[0],symbol:s[1]}));msg.textContent='Badge saved on this device.'}</script></body></html>
