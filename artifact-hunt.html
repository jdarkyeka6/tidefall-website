<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academy Artifact Hunt | Tidefall</title><link rel="stylesheet" href="styles.css"><style>body{margin:0;background:#07131f;color:#fff}.p{padding:120px 20px}.s{max-width:900px;margin:auto;text-align:center}.arena{position:relative;height:480px;border:1px solid #ffffff22;border-radius:24px;background:linear-gradient(180deg,#ffffff09,#ffffff04);overflow:hidden}.item{position:absolute;width:54px;height:54px;border:0;border-radius:50%;font-size:2rem;background:#ffffff10;cursor:pointer}.hud{display:flex;justify-content:space-between;margin:15px 0}.hidden{display:none}</style></head><body><main class="p"><div class="s"><p class="eyebrow">LOST PROPERTY</p><h1>Academy Artifact Hunt</h1><div class="hud"><span>Found: <b id="score">0</b>/15</span><span>Time: <b id="time">30</b></span></div><div id="arena" class="arena"></div><button id="start" class="button primary" style="margin-top:16px">Start hunt</button><p id="msg"></p></div></main><script>const icons=['🔑','📜','🧭','💎','🪶','🔮','🪙','🧿'];let sc=0,t=30,timer;function spawn(){arena.innerHTML='';let b=document.createElement('button');b.className='item';b.textContent=icons[Math.floor(Math.random()*icons.length)];b.style.left=Math.random()*(arena.clientWidth-60)+'px';b.style.top=Math.random()*(arena.clientHeight-60)+'px';b.onclick=()=>{sc++;score.textContent=sc;if(sc>=15)finish(true);else spawn()};arena.appendChild(b)}function finish(win){clearInterval(timer);arena.innerHTML='';start.hidden=false;msg.textContent=win?`You found all 15 with ${t}s left.`:`Time. You found ${sc}.`;localStorage.setItem('tidefall-artifact-hunt',sc)}start.onclick=()=>{sc=0;t=30;score.textContent=0;time.textContent=t;start.hidden=true;msg.textContent='';spawn();timer=setInterval(()=>{t--;time.textContent=t;if(t<=0)finish(false)},1000)}</script></body></html>
