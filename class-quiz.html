<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Which Tidefall Academy Class Would You Ace? | Tidefall</title><meta name="description" content="Take the Tidefall Academy class quiz and discover the kind of lesson you would be strongest in."><link rel="canonical" href="https://www.tidefall.com.au/class-quiz"><link rel="stylesheet" href="styles.css"><style>.p{min-height:100svh;padding:130px 20px 90px;background:radial-gradient(circle at 50% 0%,#27617a33,transparent 34%),#07131f;color:#fff}.s{width:min(900px,100%);margin:auto}.hero{text-align:center}.hero h1{font-family:Cinzel,serif;font-size:clamp(2.5rem,7vw,5rem)}.card{margin-top:28px;padding:clamp(24px,5vw,44px);border:1px solid #ffffff20;border-radius:26px;background:#ffffff08}.answers{display:grid;gap:11px}.answers button{padding:17px;text-align:left;border:1px solid #ffffff20;border-radius:15px;background:#ffffff08;color:white;font:inherit;cursor:pointer}.answers button:hover{background:#ffffff14}.progress{height:8px;background:#ffffff12;border-radius:99px;overflow:hidden;margin:24px 0}.progress span{display:block;height:100%;background:#fff}.hidden{display:none}.result{text-align:center}.traitgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.traitgrid div{padding:14px;border:1px solid #ffffff18;border-radius:14px;background:#ffffff07}.breakdown{max-width:620px;margin:24px auto;text-align:left}.r{display:grid;grid-template-columns:130px 1fr 45px;gap:8px;align-items:center;margin:8px 0}.m{height:7px;background:#ffffff12;border-radius:9px;overflow:hidden}.m i{display:block;height:100%;background:#fff}@media(max-width:650px){.traitgrid{grid-template-columns:1fr}.r{grid-template-columns:100px 1fr 40px}}</style></head><body><header class="site-header"><a class="brand" href="/">TIDEFALL</a><nav class="nav-links"><a href="/explore">Explore</a><a href="/academy">Academy</a></nav></header><main class="p"><div class="s"><section class="hero"><p class="eyebrow">ACADEMY APTITUDE</p><h1>Which Class Would You Ace?</h1><p>This scores how you learn, react and solve problems, not whether you memorised Tidefall trivia.</p></section><div class="progress"><span id="prog"></span></div><section id="q" class="card"><p id="n" class="eyebrow"></p><h2 id="qt"></h2><div id="a" class="answers"></div></section><section id="res" class="card result hidden"><p class="eyebrow">YOUR STRONGEST SUBJECT</p><h1 id="win"></h1><p id="desc"></p><div id="traits" class="traitgrid"></div><div id="breakdown" class="breakdown"></div><button class="button primary" onclick="location.reload()">Retake</button></section></div></main><script>const types={Tidecraft:{d:'You learn by feeling patterns and adapting to change. You would do well in lessons where the water itself is part of the problem.',t:['Pattern sense','Adaptability','Instinct']},Spellwork:{d:'You are precise without being rigid. You like learning how a system works and then using it deliberately.',t:['Precision','Practice','Control']},Fieldcraft:{d:'You think best when something is actually happening. Observation, movement and quick decisions are your classroom.',t:['Awareness','Action','Nerve']},Lore:{d:'You want context. You connect clues, remember details and care about why something exists, not just what it does.',t:['Curiosity','Memory','Connections']},Strategy:{d:'You naturally model consequences. Give you limited information, competing goals and a messy problem and you start building a plan.',t:['Planning','Logic','Judgement']}};const Q=[['A teacher gives no instructions beyond “begin.”',[['Watch what changes around me',{Tidecraft:3,Fieldcraft:1}],['Test the rules carefully',{Spellwork:3,Strategy:1}],['Start moving and learn live',{Fieldcraft:3,Tidecraft:1}],['Find background information',{Lore:3}],['Define the objective first',{Strategy:3,Spellwork:1}]]],['What kind of mistake teaches you fastest?',[['Misreading a pattern',{Tidecraft:3}],['Doing one step incorrectly',{Spellwork:3}],['Reacting too slowly',{Fieldcraft:3}],['Missing an important fact',{Lore:3}],['Choosing the wrong plan',{Strategy:3}]]],['Pick an assignment.',[['Track a changing current',{Tidecraft:3}],['Perform a difficult spell perfectly',{Spellwork:3}],['Navigate an unfamiliar site',{Fieldcraft:3}],['Decode an old Academy record',{Lore:3}],['Win a simulation with limited resources',{Strategy:3}]]],['You get conflicting clues.',[['Look for the pattern between them',{Tidecraft:3,Lore:1}],['Verify each one',{Spellwork:2,Strategy:2}],['Go see the situation myself',{Fieldcraft:3}],['Research where each clue came from',{Lore:3}],['Rank them by reliability',{Strategy:3}]]],['What feels satisfying?',[['Finally sensing how something moves',{Tidecraft:3}],['Getting a technique exactly right',{Spellwork:3}],['Handling a difficult situation smoothly',{Fieldcraft:3}],['Understanding something ancient',{Lore:3}],['Watching a plan work',{Strategy:3}]]],['Under pressure you rely on...',[['Instinct',{Tidecraft:3,Fieldcraft:1}],['Training',{Spellwork:3}],['Awareness',{Fieldcraft:3}],['What I know',{Lore:3}],['Priorities',{Strategy:3}]]],['A mystery appears in class.',[['Feel out what is unusual',{Tidecraft:3}],['Experiment under controlled conditions',{Spellwork:3,Strategy:1}],['Inspect the scene',{Fieldcraft:3}],['Search for precedent',{Lore:3}],['List possible explanations',{Strategy:3,Lore:1}]]],['Which compliment lands hardest?',[['You notice patterns nobody else does',{Tidecraft:3}],['Your control is ridiculous',{Spellwork:3}],['You are good in a crisis',{Fieldcraft:3}],['How did you even know that?',{Lore:3}],['You are always three moves ahead',{Strategy:3}]]],['Your notes look like...',[['Arrows, flows and shapes',{Tidecraft:3}],['Clean steps and corrections',{Spellwork:3}],['Barely any notes, I was doing the thing',{Fieldcraft:3}],['Pages of details',{Lore:3}],['Diagrams and decision trees',{Strategy:3}]]],['A task has several valid answers.',[['Find the one that feels most natural',{Tidecraft:3}],['Find the most repeatable',{Spellwork:3}],['Find the one that works fastest',{Fieldcraft:3}],['Find the one best supported by what we know',{Lore:3}],['Find the one with the best outcome',{Strategy:3}]]],['What would make you stay after class?',[['A current behaving impossibly',{Tidecraft:3}],['A technique I nearly mastered',{Spellwork:3}],['A chance to try the course again',{Fieldcraft:3}],['An unanswered historical question',{Lore:3}],['A scenario nobody solved',{Strategy:3}]]],['Final test. You can prepare one way.',[['Practice reading unpredictable changes',{Tidecraft:3}],['Repeat the core techniques',{Spellwork:3}],['Train under realistic conditions',{Fieldcraft:3}],['Study everything relevant',{Lore:3}],['Study likely scenarios and counters',{Strategy:3}]]]];let i=0,s={Tidecraft:0,Spellwork:0,Fieldcraft:0,Lore:0,Strategy:0};function draw(){n.textContent=`QUESTION ${i+1} OF ${Q.length}`;qt.textContent=Q[i][0];prog.style.width=`${i/Q.length*100}%`;a.innerHTML='';Q[i][1].forEach(([l,p])=>{let b=document.createElement('button');b.textContent=l;b.onclick=()=>{Object.entries(p).forEach(([k,v])=>s[k]+=v);i++;i<Q.length?draw():finish()};a.appendChild(b)})}function finish(){prog.style.width='100%';q.classList.add('hidden');res.classList.remove('hidden');let sort=Object.entries(s).sort((x,y)=>y[1]-x[1]),w=sort[0][0],max=sort[0][1];win.textContent=w.toUpperCase();desc.textContent=types[w].d;traits.innerHTML=types[w].t.map(x=>`<div>${x}</div>`).join('');breakdown.innerHTML=sort.map(([k,v])=>`<div class="r"><span>${k}</span><div class="m"><i style="width:${v/max*100}%"></i></div><b>${v}</b></div>`).join('');localStorage.setItem('tidefall-class-quiz',w)}draw();</script></body></html>
