<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidefall Fortune | Tidefall</title><meta name="description" content="Ask the Tide a question and receive a random Tidefall-style answer."><link rel="canonical" href="https://www.tidefall.com.au/fortune"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:white;text-align:center}.shell{width:min(760px,100%);margin:auto}.orb{width:240px;height:240px;border-radius:50%;margin:30px auto;background:radial-gradient(circle at 40% 35%,#7dd8ff,#14405b 35%,#07131f 70%);box-shadow:0 0 90px #68cfff33;display:grid;place-items:center;padding:24px}.orb span{font-family:Cinzel,serif;font-size:1.4rem}.ask{display:flex;gap:10px}.ask input{flex:1;padding:15px;border-radius:14px;border:1px solid #ffffff22;background:#0b1c29;color:#fff}@media(max-width:600px){.ask{flex-direction:column}}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">ASK THE TIDE</p><h1>Tidefall Fortune</h1><p>Ask anything. The Tide will answer vaguely enough to be suspicious.</p><div class="ask"><input id="q" placeholder="Ask the Tide something..."><button id="ask" class="button primary">Ask</button></div><div class="orb"><span id="answer">The water is still.</span></div></div></main><script>const answers=['Yes, but not for the reason you think.','Not yet.','The Tide is leaning toward yes.','Absolutely not.','Ask again after you have changed one thing.','Someone else already knows the answer.','You are looking at the wrong part of the problem.','Probably, if you stop hesitating.','No. The sea was unusually clear about that.','The answer changes depending on what you do next.','You already decided. You just want permission.','Try the strange option.','Stay where you are for now.','Move before the window closes.'];ask.onclick=()=>{answer.textContent=answers[Math.floor(Math.random()*answers.length)];localStorage.setItem('tidefall-fortune','1')}</script></body></html>
