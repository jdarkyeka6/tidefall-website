<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidefall Academy Map | Tidefall</title><meta name="description" content="Explore an interactive map of Tidefall Academy and its main areas."><link rel="canonical" href="https://www.tidefall.com.au/map"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:120px 20px;background:#07131f;color:white}.shell{width:min(1100px,100%);margin:auto}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.room{min-height:160px;padding:20px;border:1px solid #ffffff22;border-radius:20px;background:#ffffff08;cursor:pointer}.room:hover{background:#ffffff12}.room h2{font-family:Cinzel,serif}.wide{grid-column:span 2}.info{margin-top:20px;padding:24px;border:1px solid #ffffff22;border-radius:20px;background:#ffffff08}.muted{opacity:.66}@media(max-width:700px){.map{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">EXPLORE THE ACADEMY</p><h1>Tidefall Academy Map</h1><p class="muted">A first interactive map of the Academy. The full walkable castle can grow from this later.</p><div class="map"><button class="room wide" data-name="Great Hall" data-info="A central gathering place for students and major Academy moments."><h2>Great Hall</h2></button><button class="room" data-name="Dormitories" data-info="Student living quarters, divided across the Academy while Orders remain part of student identity."><h2>Dormitories</h2></button><button class="room" data-name="Classrooms" data-info="Where students learn magic, theory and the stranger rules of Tidefall."><h2>Classrooms</h2></button><button class="room" data-name="Hidden Corridors" data-info="Passages that do not always behave the way a corridor should."><h2>Hidden Corridors</h2></button><button class="room" data-name="Academy Waters" data-info="Impossible waters woven into the Academy itself."><h2>Academy Waters</h2></button><button class="room wide" data-name="Courtyard" data-info="A social crossroads between lessons, dorms and the rest of the castle."><h2>Courtyard</h2></button></div><section id="info" class="info"><h2>Select an area</h2><p>Tap a location to learn more.</p></section></div></main><script>document.querySelectorAll('.room').forEach(r=>r.onclick=()=>{info.innerHTML=`<h2>${r.dataset.name}</h2><p>${r.dataset.info}</p>`})</script></body></html>
