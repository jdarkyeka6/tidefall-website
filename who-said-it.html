<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who Said It? | Tidefall</title><link rel="stylesheet" href="styles.css"><style>body{margin:0;background:#07131f;color:white}.p{padding:120px 20px}.s{max-width:820px;margin:auto}.card{padding:30px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08;text-align:center}.q{font:700 2rem Cinzel,serif;margin:24px}.a{display:grid;grid-template-columns:1fr 1fr;gap:10px}.a button{padding:15px;border:1px solid #ffffff22;border-radius:14px;background:#ffffff08;color:#fff}.hidden{display:none}@media(max-width:600px){.a{grid-template-columns:1fr}}</style></head><body><main class="p"><div class="s"><p class="eyebrow">CHARACTER VOICES</p><h1>Who Said It?</h1><section id="game" class="card"><p>Score <b id="score">0</b> / 10</p><div id="quote" class="q"></div><div id="answers" class="a"></div></section><section id="end" class="card hidden"><h2 id="result"></h2><button class="button primary" onclick="location.reload()">Play again</button></section></div></main><script>const data=[['If it matters, do something.','Jasper'],['Not every victory has to be loud.','Lily'],['There is usually a reason. Find it.','Ava'],['The plan does not need to be pretty. It needs to move.','Harper'],['Keep your promises to yourself, especially the small ones.','Jasper'],['You can grow without becoming someone else.','Lily'],['A useful question can move you further than a confident guess.','Ava'],['Do the scary bit first. The rest gets less dramatic.','Harper'],['Strength without direction is just noise.','Jasper'],['There is nothing small about trying again.','Lily']];const names=['Jasper','Lily','Ava','Harper'];let i=0,s=0;function draw(){quote.textContent='“'+data[i][0]+'”';answers.innerHTML='';names.forEach(n=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>{if(n===data[i][1])s++;score.textContent=s;i++;i<data.length?draw():finish()};answers.appendChild(b)})}function finish(){game.classList.add('hidden');end.classList.remove('hidden');result.textContent=`${s}/10 · ${s>=8?'You know their voices.':s>=5?'Pretty solid.':'Time to revisit the characters.'}`;localStorage.setItem('tidefall-who-said-it',s)}draw();</script><script src="/quiz-back.js"></script></body></html>
