<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidefall Student ID Generator | Tidefall</title><meta name="description" content="Generate your own Tidefall Academy student ID card."><link rel="canonical" href="https://www.tidefall.com.au/student-id"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:120px 20px;background:#07131f;color:#fff}.shell{width:min(900px,100%);margin:auto}.form,.id{padding:28px;border:1px solid #ffffff22;border-radius:22px;background:#ffffff0a}.form{display:grid;gap:14px}.form input,.form select{padding:14px;border-radius:12px;border:1px solid #ffffff22;background:#0b1b29;color:#fff}.id{margin-top:20px}.id h2{font-family:Cinzel,serif}.label{opacity:.55;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">TIDEFALL ACADEMY</p><h1>Student ID Generator</h1><div class="form"><input id="name" placeholder="Your name"><select id="order"><option>Brannor</option><option>Astrae</option><option>Calyx</option><option>Nocten</option></select><select id="year"><option>Year 1</option><option>Year 2</option><option>Year 3</option><option>Year 4</option></select><button id="make" class="button primary">Generate ID</button></div><section id="card" class="id" hidden><p class="label">Student</p><h2 id="outName"></h2><p><span class="label">Order</span><br><strong id="outOrder"></strong></p><p><span class="label">Year</span><br><strong id="outYear"></strong></p><p><span class="label">Academy ID</span><br><strong id="outId"></strong></p></section></div></main><script>function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return Math.abs(h>>>0).toString(36).toUpperCase().slice(0,7)}make.onclick=()=>{const n=name.value.trim()||'Unnamed Student';outName.textContent=n;outOrder.textContent=order.value;outYear.textContent=year.value;outId.textContent='TF-'+hash(n+'|'+order.value+'|'+year.value);card.hidden=false}</script></body></html>
