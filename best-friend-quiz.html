<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who Would Be Your Tidefall Best Friend? | Tidefall</title><meta name="description" content="Take the Tidefall best friend quiz and find out whether Jasper, Lily, Ava or Harper would click with you most."><link rel="canonical" href="https://www.tidefall.com.au/best-friend-quiz"><link rel="stylesheet" href="styles.css"><style>.p{min-height:100svh;padding:130px 20px 90px;background:#07131f;color:#fff}.s{width:min(900px,100%);margin:auto}.hero{text-align:center}.hero h1{font-family:Cinzel,serif;font-size:clamp(2.6rem,7vw,5rem)}.card{margin-top:28px;padding:clamp(24px,5vw,44px);border:1px solid #ffffff20;border-radius:26px;background:#ffffff08}.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ans button{padding:17px;text-align:left;border:1px solid #ffffff20;border-radius:15px;background:#ffffff08;color:#fff;font:inherit;cursor:pointer}.ans button:hover{background:#ffffff13}.bar{height:8px;background:#ffffff12;border-radius:99px;overflow:hidden;margin:22px 0}.bar span{display:block;height:100%;background:#fff}.hidden{display:none}.result{text-align:center}.rows{max-width:600px;margin:25px auto;text-align:left}.row{display:grid;grid-template-columns:75px 1fr 45px;gap:10px;align-items:center;margin:9px 0}.mini{height:7px;background:#ffffff12;border-radius:99px;overflow:hidden}.mini i{display:block;height:100%;background:#fff}@media(max-width:650px){.ans{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="brand" href="/">TIDEFALL</a><nav class="nav-links"><a href="/explore">Explore</a><a href="/character-quiz">Character Quiz</a></nav></header><main class="p"><div class="s"><section class="hero"><p class="eyebrow">FRIENDSHIP CURRENT</p><h1>Who Would Be Your Tidefall Best Friend?</h1><p>Not who you are most like. This measures who would actually balance you best.</p></section><div class="bar"><span id="prog" style="width:0"></span></div><section id="q" class="card"><p id="num" class="eyebrow"></p><h2 id="text"></h2><div id="answers" class="ans"></div></section><section id="res" class="card result hidden"><p class="eyebrow">YOUR STRONGEST MATCH</p><h1 id="winner"></h1><p id="copy"></p><div id="rows" class="rows"></div><button class="button primary" onclick="location.reload()">Again</button></section></div></main><script>const P=['Jasper','Lily','Ava','Harper'],desc={Jasper:'Jasper would value your reliability and the fact that you show up when things matter. You would work especially well when a situation needs loyalty rather than noise.',Lily:'Lily would click with the way you listen, notice details and give people room to be themselves. The friendship would be quieter, but extremely solid.',Ava:'Ava would appreciate that you can think with her instead of simply agreeing with her. You would probably end up solving problems while everyone else is still arguing.',Harper:'Harper would drag you into things you never planned to do, and somehow you would usually be glad she did. Your friendship runs on momentum, humour and mutual backup.'};const qs=[['A free afternoon appears.',['Explore somewhere nobody goes',{Harper:3,Jasper:1}],['Find somewhere quiet and talk',{Lily:3,Jasper:1}],['Build or solve something',{Ava:3,Lily:1}],['Do whatever the group needs',{Jasper:3,Lily:1}]],['Your friend is upset.',['Sit with them without forcing them to talk',{Lily:3,Jasper:1}],['Immediately try to fix the cause',{Jasper:3,Ava:1}],['Help them work out what actually happened',{Ava:3,Lily:1}],['Get them moving and out of their head',{Harper:3,Lily:1}]],['Best kind of friend?',['Dependable',{Jasper:3}],['Understanding',{Lily:3}],['Smart and straightforward',{Ava:3}],['Fun and fearless',{Harper:3}]],['A plan collapses.',['Protect everyone first',{Jasper:3,Harper:1}],['Make sure nobody is quietly struggling',{Lily:3,Jasper:1}],['Diagnose exactly why it failed',{Ava:3}],['Invent plan B while moving',{Harper:3,Ava:1}]],['Pick a conversation.',['What would you do if everything went wrong?',{Jasper:2,Ava:1}],['Something you have never told anyone',{Lily:3}],['An impossible puzzle',{Ava:3}],['The stupidest thing we could theoretically get away with',{Harper:3}]],['Someone insults your friend.',['Step between them',{Jasper:3}],['Check your friend before escalating',{Lily:3}],['Destroy the argument with facts',{Ava:3}],['Hit them with a comeback and leave',{Harper:3}]],['Group project role?',['Keep everyone together',{Jasper:3,Lily:1}],['Make sure everyone gets heard',{Lily:3}],['Organise the entire thing',{Ava:3}],['Keep the energy alive',{Harper:3}]],['You discover a hidden corridor.',['Bring a friend before entering',{Jasper:2,Lily:1}],['Notice how strange it feels',{Lily:3}],['Map it first',{Ava:3}],['Obviously enter it',{Harper:3}]],['What earns your trust fastest?',['Actions',{Jasper:3}],['Kindness',{Lily:3}],['Honesty',{Ava:3,Lily:1}],['Shared experiences',{Harper:3,Jasper:1}]],['A friend makes a bad decision.',['Stay with them while fixing it',{Jasper:3}],['Ask why before judging',{Lily:3}],['Tell them directly it was bad',{Ava:3}],['Help recover, then tease them forever',{Harper:3}]],['Pick a strength you want in someone else.',['Courage',{Jasper:3}],['Empathy',{Lily:3}],['Judgement',{Ava:3}],['Confidence',{Harper:3}]],['At midnight someone texts “come outside.”',['Shoes on. What happened?',{Jasper:3}],['Are you okay?',{Lily:3}],['Explain why first.',{Ava:3}],['Already outside.',{Harper:3}]]];let i=0,s={Jasper:0,Lily:0,Ava:0,Harper:0};function draw(){num.textContent=`QUESTION ${i+1} OF ${qs.length}`;text.textContent=qs[i][0];prog.style.width=`${i/qs.length*100}%`;answers.innerHTML='';qs[i][1].forEach(([l,p])=>{let b=document.createElement('button');b.textContent=l;b.onclick=()=>{for(const[k,v]of Object.entries(p))s[k]+=v;i++;i<qs.length?draw():finish()};answers.appendChild(b)})}function finish(){prog.style.width='100%';q.classList.add('hidden');res.classList.remove('hidden');let sorted=Object.entries(s).sort((a,b)=>b[1]-a[1]);let w=sorted[0][0];winner.textContent=w.toUpperCase();copy.textContent=desc[w];let total=Object.values(s).reduce((a,b)=>a+b,0);rows.innerHTML=sorted.map(([k,v])=>{let pct=Math.round(v/total*100);return `<div class="row"><span>${k}</span><div class="mini"><i style="width:${pct}%"></i></div><strong>${pct}%</strong></div>`}).join('');localStorage.setItem('tidefall-best-friend-quiz',w)}draw();</script></body></html>
