<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Tidefall Dorm Room</title><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:#fff}.shell{width:min(850px,100%);margin:auto}.card{padding:30px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08}.tags{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tag{padding:9px 12px;border:1px solid #ffffff22;border-radius:99px;background:#ffffff08}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">DORM BUILDER</p><h1>Generate Your Tidefall Room</h1><section class="card"><h2 id="title">The room is waiting.</h2><div id="tags" class="tags"></div><p id="desc"></p><button id="gen" class="button primary">Generate room</button></section></div></main><script>const views=['Academy waters','the inner courtyard','storm clouds beyond the towers','a hidden garden','the Riptide grounds'];const items=['a glowing shell lamp','a locked brass box','three floating books','a suspiciously wet rug','a tiny tide-clock','a dolphin sketch','an old Academy map'];const vibes=['quiet and blue-lit','warm and cluttered','minimal and strange','full of plants','chaotic but comfortable'];gen.onclick=()=>{const pick=a=>a[Math.floor(Math.random()*a.length)];const v=pick(views),i=pick(items),b=pick(vibes);title.textContent='Your dorm room';tags.innerHTML=`<span class="tag">View: ${v}</span><span class="tag">Vibe: ${b}</span>`;desc.textContent=`Your room is ${b}, looks over ${v}, and somehow contains ${i}. Nobody remembers putting it there.`;localStorage.setItem('tidefall-room-generator','1')};</script></body></html>
