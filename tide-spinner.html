<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spin the Tide | Tidefall</title><meta name="description" content="Spin the Tide for a random Tidefall challenge, omen or Academy prompt."><link rel="canonical" href="https://www.tidefall.com.au/tide-spinner"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:white;text-align:center}.shell{width:min(820px,100%);margin:auto}.wheel{width:280px;height:280px;border-radius:50%;margin:30px auto;border:12px solid #ffffff14;display:grid;place-items:center;background:radial-gradient(circle,#12364a,#081722);box-shadow:0 0 80px #5ecfff22}.wheel span{font-family:Cinzel,serif;font-size:3rem}.card{margin-top:26px;padding:24px;border:1px solid #ffffff22;border-radius:22px;background:#ffffff08}.button{cursor:pointer}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">THE TIDE DECIDES</p><h1>Spin the Tide</h1><p>Tap the Tide and get a random challenge, omen or Academy prompt.</p><div id="wheel" class="wheel"><span>◌</span></div><button id="spin" class="button primary">Spin</button><section class="card"><h2 id="result">The Tide is waiting.</h2></section></div></main><script>const items=['Find something blue on the site before opening another page.','Visit the Academy map and choose a room you would hide in.','Take the Character Quiz and accept the result without arguing with the Tide.','Open Daily Discovery.','Pick one spell name and remember it for five minutes.','Read one character page you have not opened today.','Visit Secrets and see what is still locked.','Generate a Student ID.','Play Tide or Truth.','Open the Orders page and pick the Order you understand least.','Try Dolphin Dash and beat your last score.','Open a random Tidefall fact.','Take Would You Survive? and choose differently than last time.','Visit Relationships and pick a duo to inspect.'];spin.onclick=()=>{wheel.animate([{transform:'rotate(0deg)'},{transform:`rotate(${1080+Math.random()*720}deg)`}],{duration:900,easing:'cubic-bezier(.2,.8,.2,1)'});setTimeout(()=>{result.textContent=items[Math.floor(Math.random()*items.length)];localStorage.setItem('tidefall-spinner','1')},850)}</script></body></html>
