<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131f"><title>Tidefall Secrets | Tidefall</title><meta name="description" content="Unlock Tidefall secrets by exploring quizzes, discoveries and hidden parts of the official site."><link rel="canonical" href="https://www.tidefall.com.au/secrets"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px 90px;background:radial-gradient(circle at 50% 0%,rgba(45,104,128,.18),transparent 30%),#07131f;color:white}.shell{width:min(1000px,100%);margin:auto}.hero{text-align:center}.hero p{max-width:720px;margin:auto;opacity:.68;line-height:1.7}.meter{margin:28px 0 34px;padding:18px;border:1px solid #ffffff18;border-radius:18px;background:#ffffff08}.track{height:10px;background:#ffffff10;border-radius:99px;overflow:hidden;margin-top:10px}.track span{display:block;height:100%;background:#fff;width:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.secret{position:relative;padding:24px;border:1px solid #ffffff20;border-radius:22px;background:linear-gradient(180deg,#ffffff0b,#ffffff05);min-height:190px}.secret h2{font-family:Cinzel,serif;margin:8px 0 12px}.state{font-size:.75rem;letter-spacing:.13em;text-transform:uppercase;opacity:.55}.locked:after{content:'LOCKED';position:absolute;inset:0;display:grid;place-items:center;background:#07131fe8;backdrop-filter:blur(4px);border-radius:22px;font-family:Cinzel,serif;letter-spacing:.18em}.hint{opacity:.65;line-height:1.6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.reset{margin-top:24px;text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">◌</span><span>TIDEFALL</span></a><nav class="nav-links"><a href="/">Home</a><a href="/discover">Discover</a><a href="/house-quiz">House Quiz</a><a href="/character-quiz">Character Quiz</a><a href="/map">Map</a></nav></header><main class="page"><div class="shell"><section class="hero"><p class="eyebrow">THE SEA REMEMBERS</p><h1>Tidefall Secrets</h1><p>Explore the site to unlock fragments. Your progress is stored on this device.</p></section><div class="meter"><strong id="count">0 / 6 unlocked</strong><div class="track"><span id="meterFill"></span></div></div><div id="grid" class="grid"></div><div class="reset"><button id="reset" class="button outline" type="button">Reset secret progress</button></div></div></main><script>const secrets=[{id:'discovery',title:'The First Current',need:()=>localStorage.getItem('tidefall-discovery-visited'),text:'You returned to the Tide and found the first hidden current.',hint:'Visit Daily Discovery.',link:'/discover'},{id:'house',title:'The Choosing Tide',need:()=>localStorage.getItem('tidefall-house-result'),text:()=>`The Tide remembers choosing ${localStorage.getItem('tidefall-house-result')} for you.`,hint:'Complete the House Quiz.',link:'/house-quiz'},{id:'character',title:'The Reflection',need:()=>localStorage.getItem('tidefall-character-result'),text:()=>`You saw yourself reflected most strongly in ${localStorage.getItem('tidefall-character-result')}.`,hint:'Complete the Character Quiz.',link:'/character-quiz'},{id:'survive',title:'The Academy Notes',need:()=>localStorage.getItem('tidefall-survive-complete'),text:'You survived the Academy simulation. Somewhere, a file has definitely been updated.',hint:'Finish Would You Survive Tidefall Academy?',link:'/survive'},{id:'id',title:'The Registry',need:()=>localStorage.getItem('tidefall-student-id'),text:()=>{try{const x=JSON.parse(localStorage.getItem('tidefall-student-id'));return `The registry recognises ${x.name}, ${x.order}, ${x.id}.`}catch{return 'The registry recognises you.'}},hint:'Generate a Student ID.',link:'/student-id'},{id:'map',title:'The Hidden Route',need:()=>localStorage.getItem('tidefall-map-visited'),text:'You opened the Academy map and found a route the public corridors do not explain.',hint:'Explore the Academy map.',link:'/map'}];function render(){let unlocked=0;grid.innerHTML='';secrets.forEach(s=>{const ok=!!s.need();if(ok)unlocked++;const el=document.createElement('section');el.className='secret'+(ok?'':' locked');const body=ok?(typeof s.text==='function'?s.text():s.text):s.hint;el.innerHTML=`<span class="state">${ok?'Unlocked':'Secret'}</span><h2>${s.title}</h2><p class="hint">${body}</p><div class="actions"><a class="button outline" href="${s.link}">${ok?'Revisit source':'Find clue'}</a></div>`;grid.appendChild(el)});count.textContent=`${unlocked} / ${secrets.length} unlocked`;meterFill.style.width=`${unlocked/secrets.length*100}%`}reset.onclick=()=>{['tidefall-discovery-visited','tidefall-house-result','tidefall-character-result','tidefall-survive-complete','tidefall-student-id','tidefall-map-visited'].forEach(k=>localStorage.removeItem(k));render()};render();</script></body></html>
