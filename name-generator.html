<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131f"><title>Tidefall Name Generator | Tidefall</title><meta name="description" content="Generate a Tidefall-style student name, Order, year and Academy detail."><link rel="canonical" href="https://www.tidefall.com.au/name-generator"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px 90px;background:radial-gradient(circle at 50% 0%,rgba(62,132,157,.2),transparent 35%),#07131f;color:white}.shell{width:min(900px,100%);margin:auto;text-align:center}.card{margin-top:26px;padding:36px;border:1px solid #ffffff20;border-radius:28px;background:#ffffff09}.name{font-family:Cinzel,serif;font-size:clamp(2.8rem,8vw,5rem);margin:12px 0}.meta{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.chip{padding:8px 12px;border:1px solid #ffffff20;border-radius:99px;background:#ffffff08}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:24px}</style></head><body><header class="site-header"><a class="brand" href="/">TIDEFALL</a><nav class="nav-links"><a href="/explore">Explore</a><a href="/student-id">Student ID</a></nav></header><main class="page"><div class="shell"><p class="eyebrow">NEW STUDENT RECORD</p><h1>Tidefall Name Generator</h1><p>Pull a student identity from the Academy records.</p><section class="card"><p class="eyebrow">YOUR NAME</p><div id="name" class="name"></div><div id="meta" class="meta"></div><p id="detail"></p><div class="actions"><button id="again" class="button primary">Generate another</button><a class="button outline" href="/student-id">Make an ID</a></div></section></div></main><script>const first=['Elara','Rowan','Mira','Soren','Talia','Noah','Isla','Theo','Keria','Adrian','Maeve','Callum','Nia','Felix','Aria','Lachlan','Milo','Seren','Raf','Eli'];const last=['Vale','Holloway','Hart','Rees','Monroe','Rowan','Pike','Tran','Burns','Mercer','Price','Alvarez','Vey','Morrow','Quill','Aster','Fenn','Marlowe','Keir','Sable'];const orders=['Brannor','Astrae','Calyx','Nocten'];const focuses=['Tide Theory','Voice Magic','Riptide','Ancient Waters','Dueling','Magical Creatures','Academy History','Field Studies'];const quirks=['always knows the quickest staircase','has been told not to touch unidentified shells','keeps finding notes in books they never borrowed','claims one corridor changes length after midnight','can recognise three dolphins on sight','has been late to class because of impossible water','keeps a notebook of spells they definitely did not invent','has never once trusted a door marked PRIVATE'];function pick(a){return a[Math.floor(Math.random()*a.length)]}function generate(){const n=pick(first)+' '+pick(last);name.textContent=n;const o=pick(orders),y='Year '+(1+Math.floor(Math.random()*4)),f=pick(focuses);meta.innerHTML=`<span class="chip">${o}</span><span class="chip">${y}</span><span class="chip">${f}</span>`;detail.textContent=n+' '+pick(quirks)+'.';localStorage.setItem('tidefall-name-generator','1')}again.onclick=generate;generate();</script></body></html>
