<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spell Speed Challenge | Tidefall</title><link rel="stylesheet" href="styles.css"><style>body{margin:0;background:#07131f;color:#fff}.p{padding:120px 20px}.s{max-width:800px;margin:auto;text-align:center}.card{padding:30px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08}.word{font:700 3rem Cinzel,serif;margin:20px}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.opts button{padding:16px;border:1px solid #ffffff22;border-radius:14px;background:#ffffff08;color:white}.hidden{display:none}</style></head><body><main class="p"><div class="s"><p class="eyebrow">FAST CASTING</p><h1>Spell Speed</h1><section id="game" class="card"><p>Score: <b id="score">0</b> · Time: <b id="time">20</b></p><div id="word" class="word">READY</div><div id="opts" class="opts"></div><button id="start" class="button primary">Start</button></section><section id="end" class="card hidden"><h2 id="rank"></h2><p id="final"></p><button class="button primary" onclick="location.reload()">Again</button></section></div></main><script>const spells=[['Veyra','Light'],['Sela','Pull'],['Tavra','Shield'],['Raska','Duel'],['Valka','Move']];let sc=0,t=20,timer;function round(){let x=spells[Math.floor(Math.random()*spells.length)];word.textContent=x[0];let answers=[...spells.map(v=>v[1])].sort(()=>Math.random()-.5).slice(0,3);if(!answers.includes(x[1]))answers[0]=x[1];answers.sort(()=>Math.random()-.5);opts.innerHTML='';answers.forEach(v=>{let b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(v===x[1])sc++;else sc=Math.max(0,sc-1);score.textContent=sc;round()};opts.appendChild(b)})}start.onclick=()=>{start.hidden=true;round();timer=setInterval(()=>{t--;time.textContent=t;if(t<=0){clearInterval(timer);game.classList.add('hidden');end.classList.remove('hidden');rank.textContent=sc>=15?'TIDEFAST':sc>=9?'QUICK CASTER':'APPRENTICE';final.textContent=`You scored ${sc}.`;localStorage.setItem('tidefall-spell-speed',sc)}},1000)}</script></body></html>
