<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidefall Memory | Tidefall</title><meta name="description" content="Play a quick Tidefall memory matching game."><link rel="canonical" href="https://www.tidefall.com.au/memory"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:white;text-align:center}.shell{width:min(760px,100%);margin:auto}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:28px}.card{aspect-ratio:1;border:1px solid #ffffff22;border-radius:18px;background:#0e2534;color:white;font-size:2rem;cursor:pointer}.matched{background:#ffffff18}.meta{display:flex;justify-content:center;gap:20px;margin-top:18px}@media(max-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">ACADEMY MEMORY</p><h1>Match the Tide</h1><p>Find all six pairs.</p><div class="meta"><span>Moves: <strong id="moves">0</strong></span><span>Pairs: <strong id="pairs">0</strong>/6</span></div><div id="grid" class="grid"></div><button id="reset" class="button outline" style="margin-top:22px">Shuffle again</button></div></main><script>const icons=['◌','✦','≈','◆','☾','✧'];let deck=[],first=null,lock=false,m=0,p=0;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){deck=shuffle([...icons,...icons].map((v,i)=>({v,id:i,open:false,matched:false})));first=null;lock=false;m=0;p=0;moves.textContent=0;pairs.textContent=0;draw()}function draw(){grid.innerHTML='';deck.forEach((c,i)=>{const b=document.createElement('button');b.className='card'+(c.matched?' matched':'');b.textContent=c.open||c.matched?c.v:'?';b.onclick=()=>flip(i);grid.appendChild(b)})}function flip(i){if(lock||deck[i].open||deck[i].matched)return;deck[i].open=true;if(first===null){first=i;draw();return}m++;moves.textContent=m;if(deck[first].v===deck[i].v){deck[first].matched=deck[i].matched=true;p++;pairs.textContent=p;first=null;if(p===6)localStorage.setItem('tidefall-memory','1');draw()}else{lock=true;draw();setTimeout(()=>{deck[first].open=false;deck[i].open=false;first=null;lock=false;draw()},650)}}reset.onclick=start;start()</script></body></html>
