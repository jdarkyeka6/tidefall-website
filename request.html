<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request • Tidefall</title>
  <meta name="robots" content="noindex,follow,noarchive" />
  <meta name="googlebot" content="noindex,follow,noarchive" />
  <link rel="canonical" href="https://www.tidefall.com.au/request" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="inner-page">
  <header class="site-header"><a class="brand" href="/"><span class="brand-mark">◌</span><span>TIDEFALL</span></a></header>
  <main class="form-page"><section class="form-shell"><p class="eyebrow">MESSAGE THE ACADEMY</p><h1>What should Tidefall add next?</h1><p class="form-lead">Pitch a page, feature, secret, game, lore section, or anything else you want to see.</p>
      <form class="tidefall-form" data-demo-form>
        <label>Name<input type="text" name="name" required placeholder="Your name" /></label>
        <label>Email<input type="email" name="email" required placeholder="you@example.com" /></label>
        <label>Age<input type="number" name="age" min="1" max="120" required placeholder="Age" /></label>
        <label>What do you want to see?<textarea name="message" rows="7" required placeholder="Tell us what you want added..."></textarea></label>
        <button class="button primary" type="submit">Send</button><p class="form-note">Demo form for now. We can connect this to Supabase, email, or another backend later.</p>
      </form><a class="back-link" href="/">← Return to Tidefall</a></section></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div><script src="script.js"></script>
</body></html>
