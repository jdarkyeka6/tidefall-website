<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mystery Object | Tidefall</title><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:#fff}.shell{width:min(800px,100%);margin:auto}.card{padding:32px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08}.object{font-family:Cinzel,serif;font-size:clamp(2rem,6vw,4rem);margin:18px 0}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">FOUND IN THE ACADEMY</p><h1>Mystery Object Generator</h1><section class="card"><div id="name" class="object">?</div><p id="desc">Generate something the Academy probably should have labelled.</p><button id="gen" class="button primary">Generate object</button></section></div></main><script>const a=['Cracked','Silver','Whispering','Flooded','Glass','Brass','Forgotten','Blue','Hollow','Tide-marked'];const b=['Compass','Key','Lantern','Coin','Book','Mirror','Shell','Clock','Bottle','Mask'];const effects=['points toward whoever is lying','gets colder near hidden doors','whispers one word at midnight','fills with seawater when danger is close','shows a room that does not exist','opens exactly one unknown lock','stops working when watched','remembers the last person who touched it','moves slightly every time you blink','glows near old magic'];gen.onclick=()=>{const p=x=>x[Math.floor(Math.random()*x.length)];name.textContent=`${p(a)} ${p(b)}`;desc.textContent=`It ${p(effects)}. There is no note explaining why.`;localStorage.setItem('tidefall-mystery-object','1')};</script></body></html>
