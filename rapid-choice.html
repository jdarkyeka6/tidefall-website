<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapid Choice | Tidefall</title><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:#fff;text-align:center}.shell{width:min(760px,100%);margin:auto}.card{padding:32px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.choice{padding:22px;border:1px solid #ffffff22;border-radius:16px;background:#ffffff08;color:white;cursor:pointer}.timer{font-size:2rem;margin:12px 0}@media(max-width:600px){.choices{grid-template-columns:1fr}}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">NO TIME TO OVERTHINK</p><h1>Rapid Choice</h1><section class="card"><p id="n"></p><div id="timer" class="timer">5</div><h2 id="q"></h2><div id="choices" class="choices"></div></section></div></main><script>const qs=[['Hidden corridor or safe stairs?','Hidden corridor','Safe stairs'],['Unknown spell or unknown creature?','Spell','Creature'],['Riptide match or mystery lesson?','Riptide','Mystery lesson'],['Brass key or glowing map?','Key','Map'],['Follow Jasper or Ava?','Jasper','Ava'],['Ask Lily or Harper?','Lily','Harper'],['Explore at night or before breakfast?','Night','Breakfast'],['Take the shortcut or the known route?','Shortcut','Known route'],['Trust the Tide or trust your plan?','The Tide','My plan'],['Open the box or leave it alone?','Open it','Leave it']];let i=0,score=0,t=5,int;function draw(){if(i>=qs.length){clearInterval(int);n.textContent='COMPLETE';timer.textContent='';q.textContent=`You made ${score} risky choices out of ${qs.length}.`;choices.innerHTML='<a class="button primary" href="/explore">Back to Explore</a>';localStorage.setItem('tidefall-rapid-choice','1');return}n.textContent=`Choice ${i+1} of ${qs.length}`;q.textContent=qs[i][0];choices.innerHTML='';[1,2].forEach(j=>{const b=document.createElement('button');b.className='choice';b.textContent=qs[i][j];b.onclick=()=>{if(j===1)score++;next()};choices.appendChild(b)});t=5;timer.textContent=t;clearInterval(int);int=setInterval(()=>{t--;timer.textContent=t;if(t<=0)next()},1000)}function next(){clearInterval(int);i++;draw()}draw();</script></body></html>
