<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidefall Reaction Test</title><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:#fff;text-align:center}.shell{width:min(760px,100%);margin:auto}.box{height:320px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08;display:grid;place-items:center;cursor:pointer;font-size:2rem}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">REFLEX TRAINING</p><h1>Catch the Current</h1><p>Click only when the current flashes.</p><div id="box" class="box">Click to start</div><p id="result"></p></div></main><script>let start=0,timer,ready=false;box.onclick=()=>{if(!start){box.textContent='Wait for it...';start=1;timer=setTimeout(()=>{ready=true;box.textContent='NOW';box.style.background='#ffffff20';window.t0=performance.now()},1000+Math.random()*3000);return}if(!ready){clearTimeout(timer);box.textContent='Too early 💀 Click to retry';start=0;result.textContent='The Tide was not impressed.';return}const ms=Math.round(performance.now()-t0);result.textContent=`${ms} ms`;localStorage.setItem('tidefall-reaction',String(ms));box.textContent='Again';box.style.background='#ffffff08';start=0;ready=false};</script></body></html>
