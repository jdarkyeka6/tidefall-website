<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131f"><title>Dolphin Dash | Tidefall</title><meta name="description" content="Play a tiny Tidefall Riptide reflex game and catch the dolphin before it disappears."><link rel="canonical" href="https://www.tidefall.com.au/dolphin-dash"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px 90px;background:radial-gradient(circle at 50% 10%,rgba(66,153,183,.22),transparent 34%),#07131f;color:#fff}.shell{width:min(900px,100%);margin:auto;text-align:center}.arena{position:relative;height:460px;margin-top:24px;border:1px solid #ffffff20;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#0a2233,#07131f)}.target{position:absolute;width:72px;height:72px;border-radius:50%;border:1px solid #ffffff55;background:#ffffff12;color:white;font-size:2rem;cursor:pointer;display:grid;place-items:center;transition:transform .1s}.hud{display:flex;justify-content:center;gap:24px;flex-wrap:wrap}.hud strong{font-size:1.4rem}.muted{opacity:.65}.actions{margin-top:20px}</style></head><body><header class="site-header"><a class="brand" href="/">TIDEFALL</a><nav class="nav-links"><a href="/explore">Explore</a></nav></header><main class="page"><div class="shell"><p class="eyebrow">RIPTIDE TRAINING</p><h1>Dolphin Dash</h1><p class="muted">Catch the dolphin as many times as you can before the timer hits zero.</p><div class="hud"><span>Time <strong id="time">20</strong></span><span>Score <strong id="score">0</strong></span><span>Best <strong id="best">0</strong></span></div><div id="arena" class="arena"><button id="target" class="target" aria-label="Catch dolphin">🐬</button></div><div class="actions"><button id="start" class="button primary">Start</button></div></div></main><script>let t=20,s=0,running=false,timer;best.textContent=localStorage.getItem('tidefall-dolphin-best')||0;function move(){const maxX=arena.clientWidth-target.offsetWidth,maxY=arena.clientHeight-target.offsetHeight;target.style.left=Math.random()*maxX+'px';target.style.top=Math.random()*maxY+'px';target.style.transform=`rotate(${Math.random()*40-20}deg)`}target.onclick=()=>{if(!running)return;s++;score.textContent=s;move()};start.onclick=()=>{clearInterval(timer);t=20;s=0;running=true;time.textContent=t;score.textContent=s;start.disabled=true;move();timer=setInterval(()=>{t--;time.textContent=t;if(t<=0){clearInterval(timer);running=false;start.disabled=false;start.textContent='Play again';const b=Math.max(s,Number(localStorage.getItem('tidefall-dolphin-best')||0));localStorage.setItem('tidefall-dolphin-best',b);localStorage.setItem('tidefall-dolphin-dash','1');best.textContent=b;target.style.left='50%';target.style.top='50%';target.style.transform='translate(-50%,-50%)'}},1000)};move();</script></body></html>
