<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidefall Outfit Builder</title><style>:root{--bg:#06131f;--panel:#0b2231;--ink:#f7fbfc;--muted:#9eb7c2;--line:#ffffff20;--accent:#e8f9fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#16435a,#06131f 50%);color:var(--ink);font-family:Inter,system-ui,sans-serif}button{font:inherit;cursor:pointer}.nav{position:sticky;top:0;z-index:10;padding:14px 5vw;background:#06131fee;backdrop-filter:blur(15px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font:700 1rem Georgia,serif;letter-spacing:.2em}.navlinks{display:flex;gap:14px;align-items:center}.nav a{color:inherit;text-decoration:none}.account{padding:9px 15px;border:1px solid #ffffff30;border-radius:999px;background:#ffffff0a}.back{color:var(--muted)}main{max-width:1250px;margin:auto;padding:55px 20px 90px}.hero{text-align:center}.eyebrow{font-size:.7rem;font-weight:900;letter-spacing:.28em;color:#9bd0dc}.hero h1{font:700 clamp(3rem,8vw,6rem)/.9 Georgia,serif;margin:15px 0}.hero p{color:var(--muted);max-width:700px;margin:auto;line-height:1.7}.layout{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:45px}.panel,.preview{background:#0b2231cc;border:1px solid var(--line);border-radius:25px;padding:25px}.section{padding:0 0 22px;margin-bottom:22px;border-bottom:1px solid var(--line)}.section:last-child{border:0}.section h2{font:700 1.5rem Georgia,serif;margin:0 0 13px}.choices{display:flex;flex-wrap:wrap;gap:9px}.choice{border:1px solid var(--line);background:#ffffff08;color:var(--muted);border-radius:999px;padding:10px 14px}.choice.selected{background:var(--accent);color:#06131f;border-color:var(--accent);font-weight:800}.preview{position:sticky;top:85px;height:max-content}.previewbox{background:#f4f0e8;border-radius:20px;overflow:hidden;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center}.previewbox img{width:100%;height:100%;object-fit:contain}.preview h2{font:700 2.1rem Georgia,serif;margin:20px 0 5px}.muted{color:var(--muted)}.summary{display:grid;grid-template-columns:1fr auto;gap:7px;margin:18px 0;color:var(--muted)}.total{font-size:1.4rem;font-weight:900;margin-top:15px}.actions{display:flex;gap:10px}.primary,.secondary{flex:1;padding:14px;border-radius:12px;font-weight:900}.primary{border:0;background:var(--accent);color:#06131f}.secondary{border:1px solid var(--line);background:#ffffff08;color:var(--ink)}.saved{margin-top:12px;color:#9bd0dc;font-size:.85rem;min-height:20px}@media(max-width:800px){.layout{grid-template-columns:1fr}.preview{position:static}.hero{padding-top:10px}.navlinks{gap:7px}.back{display:none}.account{font-size:.85rem}}</style></head><body><header class="nav"><a class="brand" href="/">TIDEFALL</a><div class="navlinks"><a class="back" href="/merch2.html">← Back to Merch</a><a class="account" href="/account.html">Account</a></div></header><main><section class="hero"><div class="eyebrow">TIDEFALL MERCH</div><h1>BUILD YOUR LOOK</h1><p>Choose a character, season, garment and fit. Your demo outfit updates as you build it.</p></section><div class="layout"><section class="panel"><div class="section"><h2>1 · Character</h2><div class="choices" id="character"></div></div><div class="section"><h2>2 · Season</h2><div class="choices" id="season"></div></div><div class="section"><h2>3 · Top</h2><div class="choices" id="top"></div></div><div class="section"><h2>4 · Bottom</h2><div class="choices" id="bottom"></div></div><div class="section"><h2>5 · Extra</h2><div class="choices" id="extra"></div></div><div class="section"><h2>6 · Cut</h2><div class="choices" id="cut"></div></div><div class="section"><h2>7 · Size</h2><div class="choices" id="size"></div></div></section><aside class="preview"><div class="previewbox"><img loading="lazy" id="previewImg" src="https://raw.githubusercontent.com/jdarkyeka6/tidefall-website/main/assets/merch/teens-pjs.webp" alt="Tidefall outfit preview"></div><h2 id="lookName">Lily Summer Look</h2><div class="muted" id="lookDesc">Character · Summer · Feminine</div><div class="summary" id="summary"></div><div class="total" id="total">A$0</div><div class="actions"><button class="primary" onclick="addLook()">Add outfit to bag</button><button class="secondary" onclick="saveLook()">♡ Save look</button></div><div class="saved" id="saved"></div></aside></div></main><script>const IMG='https://raw.githubusercontent.com/jdarkyeka6/tidefall-website/main/assets/merch/';const state={character:'Lily',season:'Summer',top:'Character Tee',bottom:'Character Shorts',extra:'None',cut:'Feminine',size:'Teen'};const prices={'Character Tee':19,'Tidefall Tee':19,'Hoodie':29,'Long Sleeve':24,'Character Shorts':25,'Tidefall Shorts':25,'Long Pants':35,'PJ Shorts':30,'Marshmallow Hoodie':29,'Tidefall Bag':29,'Bottle':19,'None':0};const opts={character:['Lily','Harper','Ava','Jasper','Tidefall'],season:['Summer','Winter'],top:['Character Tee','Tidefall Tee','Hoodie','Long Sleeve'],bottom:['Character Shorts','Tidefall Shorts','PJ Shorts','Long Pants'],extra:['None','Marshmallow Hoodie','Tidefall Bag','Bottle'],cut:['Standard','Feminine','Male'],size:['Kids','Teen','Adult']};function render(name){const el=document.getElementById(name);el.innerHTML=opts[name].map(v=>`<button class="choice ${state[name]===v?'selected':''}" onclick="pick('${name}','${v}')">${v}</button>`).join('')}function pick(k,v){state[k]=v;render(k);update()}function update(){document.getElementById('lookName').textContent=`${state.character} ${state.season} Look`;document.getElementById('lookDesc').textContent=`${state.character} · ${state.season} · ${state.cut} cut · ${state.size}`;let items=[];if(state.top)items.push([state.top,prices[state.top]||0]);if(state.bottom)items.push([state.bottom,prices[state.bottom]||0]);if(state.extra!=='None')items.push([state.extra,prices[state.extra]||0]);document.getElementById('summary').innerHTML=items.map(x=>`<span>${x[0]}</span><strong>A$${x[1]}</strong>`).join('');let total=items.reduce((a,x)=>a+x[1],0);document.getElementById('total').textContent=`A$${total}`;let file=state.season==='Winter'?'teens-pjs.webp':'actual-merch.webp';document.getElementById('previewImg').src=IMG+file}function addLook(){localStorage.setItem('tidefallDemoLook',JSON.stringify(state));document.getElementById('saved').textContent='✓ Outfit saved to your demo bag. You can keep browsing without paying.'}function saveLook(){localStorage.setItem('tidefallSavedLook',JSON.stringify(state));document.getElementById('saved').textContent='♡ Saved to My Tidefall Looks on this device.'}Object.keys(opts).forEach(render);update();</script></body></html>
