<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidefall Locker | Tidefall</title><meta name="description" content="Open your Tidefall locker and collect random Academy items."><link rel="canonical" href="https://www.tidefall.com.au/locker"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:#fff}.shell{width:min(900px,100%);margin:auto;text-align:center}.locker{margin:32px auto;width:min(420px,100%);min-height:420px;border:2px solid #ffffff22;border-radius:28px;background:linear-gradient(#102c3f,#081722);padding:28px;box-shadow:inset 0 0 50px #0008}.slot{padding:18px;border-bottom:1px solid #ffffff18}.collection{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}.item{padding:16px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff07}@media(max-width:600px){.collection{grid-template-columns:1fr}}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">YOUR ACADEMY LOCKER</p><h1>Open Your Locker</h1><p>Each open gives you a random Tidefall item. Your collection is saved on this device.</p><div class="locker"><div class="slot"><h2 id="found">Your locker is shut.</h2></div><button id="open" class="button primary">Open locker</button><div id="collection" class="collection"></div></div></div></main><script>const pool=['Brass key','Salt-stained notebook','Brannor thread bracelet','Astrae ink vial','Calyx seed packet','Nocten compass','Folded Academy map','Dolphin whistle','Unlabelled spell card','Blue sea-glass shard','Old lesson token','Tiny tide charm'];let owned=JSON.parse(localStorage.getItem('tidefall-locker-items')||'[]');function draw(){collection.innerHTML=owned.length?owned.map(x=>`<div class="item">${x}</div>`).join(''):'<p>No items yet.</p>'}open.onclick=()=>{const x=pool[Math.floor(Math.random()*pool.length)];found.textContent='You found: '+x;if(!owned.includes(x)){owned.push(x);localStorage.setItem('tidefall-locker-items',JSON.stringify(owned))}localStorage.setItem('tidefall-locker','1');draw()};draw()</script></body></html>
