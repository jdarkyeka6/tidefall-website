<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131f"><title>What Kind of Tidefall Magic Fits You? | Tidefall</title><meta name="description" content="Take the Tidefall magic style quiz and discover whether your instincts lean toward Shielding, Motion, Tidecraft or Voice Magic."><link rel="canonical" href="https://www.tidefall.com.au/magic-style-quiz"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px 90px;background:#07131f;color:white}.shell{width:min(920px,100%);margin:auto}.card{padding:32px;border:1px solid #ffffff20;border-radius:24px;background:#ffffff08}.answers{display:grid;gap:12px}.answer{padding:17px;border:1px solid #ffffff20;border-radius:15px;background:#ffffff08;color:white;text-align:left;cursor:pointer}.hidden{display:none}.bars{margin-top:24px}.row{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;margin:10px 0}.bar{height:9px;background:#ffffff12;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:white}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">MAGIC INSTINCTS</p><h1>What Kind of Tidefall Magic Fits You?</h1><section id="q" class="card"><p id="num"></p><h2 id="qt"></h2><div id="a" class="answers"></div></section><section id="r" class="card hidden"><p class="eyebrow">YOUR STRONGEST CURRENT</p><h2 id="rn"></h2><p id="rc"></p><div id="bars" class="bars"></div><p><button id="again" class="button primary">Take it again</button> <a class="button outline" href="/spell-trial">Spell Trial</a></p></section></div></main><script>const meta={Shielding:'You naturally protect, stabilise and create space for others.',Motion:'You think in momentum, movement and changing the situation fast.',Tidecraft:'You are drawn to currents, patterns and reading what the water is doing.',Voice:'You prefer precision, intention and using the right words at the right moment.'};const qs=[['A spell goes wrong near your friends.',[['Contain it',{Shielding:3,Voice:1}],['Move everyone clear',{Motion:3,Shielding:1}],['Read how the magic is flowing',{Tidecraft:3}],['Call the exact counterspell',{Voice:3}]]],['What feels most satisfying?',[['Stopping something dangerous',{Shielding:3}],['Making something move',{Motion:3}],['Understanding a current',{Tidecraft:3}],['Getting a spell exactly right',{Voice:3}]]],['In a duel you prefer to...',[['Block and outlast',{Shielding:3}],['Keep repositioning',{Motion:3}],['Use the environment',{Tidecraft:3}],['Win through timing',{Voice:3}]]],['Pick a weakness you would tolerate.',[['Slower but safer',{Shielding:3}],['Messier but faster',{Motion:3}],['Harder to learn but flexible',{Tidecraft:3}],['Precise but unforgiving',{Voice:3}]]],['You find unknown magic.',[['Secure it',{Shielding:2,Voice:1}],['Test how it reacts to movement',{Motion:2,Tidecraft:1}],['Observe its pattern',{Tidecraft:3}],['Study the wording or trigger',{Voice:3}]]],['Your team needs you most when...',[['They need protection',{Shielding:3}],['They need momentum',{Motion:3}],['They need insight',{Tidecraft:3}],['They need precision',{Voice:3}]]],['Pick a training room.',[['Barrier chamber',{Shielding:3}],['Moving-platform hall',{Motion:3}],['Flooded current lab',{Tidecraft:3}],['Echo chamber',{Voice:3}]]],['A locked object reacts to magic.',[['Protect everyone first',{Shielding:2}],['Shift it physically',{Motion:2}],['Follow the energy around it',{Tidecraft:3}],['Try the smallest exact spell',{Voice:3}]]],['Which word sounds best?',[['Guard',{Shielding:3}],['Drive',{Motion:3}],['Flow',{Tidecraft:3}],['Speak',{Voice:3}]]],['What would you want your magic to be known for?',[['Reliability',{Shielding:3}],['Speed',{Motion:3}],['Depth',{Tidecraft:3}],['Control',{Voice:3}]]],['You are under pressure.',[['Create safety',{Shielding:3}],['Change position',{Motion:3}],['Read the situation',{Tidecraft:3}],['Choose one exact action',{Voice:3}]]],['Final instinct.',[['Hold',{Shielding:3}],['Move',{Motion:3}],['Listen',{Tidecraft:3}],['Speak',{Voice:3}]]]];let i=0,s={Shielding:0,Motion:0,Tidecraft:0,Voice:0};function draw(){num.textContent=`Question ${i+1} of ${qs.length}`;qt.textContent=qs[i][0];a.innerHTML='';qs[i][1].forEach(([label,p])=>{const b=document.createElement('button');b.className='answer';b.textContent=label;b.onclick=()=>{Object.entries(p).forEach(([k,v])=>s[k]+=v);i++;i<qs.length?draw():finish()};a.appendChild(b)})}function finish(){q.classList.add('hidden');r.classList.remove('hidden');const e=Object.entries(s).sort((x,y)=>y[1]-x[1]);rn.textContent=e[0][0].toUpperCase();rc.textContent=meta[e[0][0]];const m=Math.max(...e.map(x=>x[1]),1);bars.innerHTML=e.map(([k,v])=>`<div class="row"><span>${k}</span><div class="bar"><span style="width:${v/m*100}%"></span></div><strong>${v}</strong></div>`).join('');localStorage.setItem('tidefall-magic-style',e[0][0])}again.onclick=()=>{i=0;s={Shielding:0,Motion:0,Tidecraft:0,Voice:0};r.classList.add('hidden');q.classList.remove('hidden');draw()};draw();</script></body></html>
