,['Make them laugh','Harper']]],['Pick your strongest signal.',[['Reliability','Jasper'],['Empathy','Lily'],['Honesty','Ava'],['Energy','Harper']]]];let i=0,s={Jasper:0,Lily:0,Ava:0,Harper:0};function draw(){n.textContent=`QUESTION ${i+1} OF ${Q.length}`;t.textContent=Q[i][0];a.innerHTML='';Q[i][1].forEach(([l,k])=>{let b=document.createElement('button');b.textContent=l;b.onclick=()=>{s[k]+=2;i++;i<Q.length?draw():finish()};a.appendChild(b)})}function finish(){q.classList.add('hidden');r.classList.remove('hidden');let x=Object.entries(s).sort((a,b)=>b[1]-a[1])[0][0];w.textContent=x.toUpperCase();c.textContent=d[x];localStorage.setItem('tidefall-trust-quiz',x)}draw();</script></body></html>
