name: Split Book One Into Chapter Files

on:
  push:
    paths:
      - '.github/workflows/split-book-chapters.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Split manuscript into 120 chapter files and update reader
        shell: bash
        run: |
          cat > /tmp/split-book.mjs <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const sourceDir = 'api/booksource';
          const parts = fs.readdirSync(sourceDir)
            .filter(n => /^part-\d+\.txt$/.test(n))
            .sort((a,b) => Number(a.match(/\d+/)[0]) - Number(b.match(/\d+/)[0]));
          if (parts.length !== 33) throw new Error(`Expected 33 source parts, found ${parts.length}`);
          const manuscript = parts.map(n => fs.readFileSync(path.join(sourceDir,n),'utf8')).join('');
          const re = /^CHAPTER\s+([^\r\n]+)\r?\n([^\r\n]+)\r?\n/gm;
          const matches = [...manuscript.matchAll(re)];
          if (matches.length !== 120) throw new Error(`Expected 120 chapters, parsed ${matches.length}`);
          const outDir='api/book1-chapters';
          fs.mkdirSync(outDir,{recursive:true});
          for (const old of fs.readdirSync(outDir)) fs.rmSync(path.join(outDir,old),{recursive:true,force:true});
          const manifest=[];
          for(let i=0;i<matches.length;i++){
            const m=matches[i];
            const bodyStart=m.index+m[0].length;
            const bodyEnd=i+1<matches.length?matches[i+1].index:manuscript.length;
            const body=manuscript.slice(bodyStart,bodyEnd).trim();
            if(!body) throw new Error(`Chapter ${i+1} body is empty`);
            const number=i+1;
            const title=m[2].trim();
            const filename=`book1-chapter${number}.txt`;
            fs.writeFileSync(path.join(outDir,filename), body+'\n');
            manifest.push({number,title,file:filename});
          }
          fs.writeFileSync(path.join(outDir,'manifest.json'),JSON.stringify(manifest,null,2)+'\n');

          const reader = `import fs from 'node:fs';\nimport path from 'node:path';\n\nconst DIR=path.join(process.cwd(),'api','book1-chapters');\nconst MANIFEST=JSON.parse(fs.readFileSync(path.join(DIR,'manifest.json'),'utf8'));\nconst esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst paras=s=>s.split(/\\n\\s*\\n/).filter(Boolean).map(p=>'<p>'+esc(p.replace(/\\s*\\n\\s*/g,' '))+'</p>').join('');\nexport default function handler(req,res){\n const raw=Array.isArray(req.query?.chapter)?req.query.chapter[0]:req.query?.chapter;\n const n=Math.min(120,Math.max(1,parseInt(raw||'1',10)||1));\n const meta=MANIFEST[n-1];\n const body=fs.readFileSync(path.join(DIR,meta.file),'utf8');\n const options=MANIFEST.map(x=>'<option value=\"'+x.number+'\" '+(x.number===n?'selected':'')+'>Chapter '+x.number+' — '+esc(x.title)+'</option>').join('');\n const prev=n>1?'<a href=\"/books?chapter='+(n-1)+'#reader\">← Previous chapter</a>':'<span></span>';\n const next=n<120?'<a href=\"/books?chapter='+(n+1)+'#reader\">Next chapter →</a>':'<span></span>';\n const html='<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Tidefall: The Listening Tide | Chapter '+n+'</title><link rel=\"stylesheet\" href=\"/styles.css\"><link rel=\"stylesheet\" href=\"/reader-isolation.css\"></head><body><header class=\"site-header\"><a class=\"brand\" href=\"/\">TIDEFALL</a><nav class=\"nav-links\"><a href=\"/\">Home</a><a href=\"/start-here\">Start Here</a><a href=\"/explore\">Explore</a><a href=\"/academy\">Academy</a><a href=\"/characters\">Characters</a><a href=\"/books\" aria-current=\"page\">Books</a><a href=\"/lore\">Lore</a><a href=\"/spells\">Spells</a></nav></header><main id=\"reader\" class=\"reader-shell\"><aside class=\"reader-sidebar\"><p class=\"reader-kicker\">THE LISTENING TIDE</p><h1>BOOK ONE</h1><label for=\"chapter-select\">JUMP TO CHAPTER</label><select id=\"chapter-select\" onchange=\"location.href=\\\'/books?chapter=\\\'+this.value+\\\'#reader\\\'\">'+options+'</select><div class=\"reader-nav\">'+prev+next+'</div></aside><article class=\"reader-article\"><p class=\"reader-count\">CHAPTER '+n+' OF 120</p><h2>'+esc(meta.title)+'</h2><div class=\"reader-copy\">'+paras(body)+'</div><div class=\"reader-bottom-nav\">'+prev+next+'</div></article></main><script src=\"/site-ui.js\" defer></script></body></html>';
          res.setHeader('Content-Type','text/html; charset=utf-8'); res.setHeader('Cache-Control','public, max-age=0, s-maxage=300'); res.status(200).send(html);\n}\n`;
          fs.writeFileSync('api/books-reader.js',reader);

          const cfg=JSON.parse(fs.readFileSync('vercel.json','utf8'));
          cfg.functions=cfg.functions||{};
          cfg.functions['api/books-reader.js']={...(cfg.functions['api/books-reader.js']||{}),includeFiles:'api/book1-chapters/**'};
          fs.writeFileSync('vercel.json',JSON.stringify(cfg,null,2)+'\n');
          console.log(`Wrote ${matches.length} chapter files. Chapter 1 bytes: ${fs.statSync(path.join(outDir,'book1-chapter1.txt')).size}`);
          NODE
          node /tmp/split-book.mjs
          test -s api/book1-chapters/book1-chapter1.txt
          test -s api/book1-chapters/book1-chapter120.txt
          test "$(find api/book1-chapters -name 'book1-chapter*.txt' | wc -l)" -eq 120
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/book1-chapters api/books-reader.js vercel.json
          git commit -m "Split Book One into 120 chapter files" || exit 0
          git push
