<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131f"><title>Tidefall Spell Trial | Tidefall</title><meta name="description" content="Take the Tidefall Spell Trial and test what you know about Tidefall magic."><link rel="canonical" href="https://www.tidefall.com.au/spell-trial"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px 90px;background:radial-gradient(circle at 50% 0%,rgba(85,130,180,.18),transparent 33%),#07131f;color:#fff}.shell{width:min(900px,100%);margin:auto}.hero{text-align:center}.hero h1{font-family:Cinzel,serif;font-size:clamp(3rem,7vw,5.6rem);margin:8px 0}.hero p{max-width:700px;margin:auto;opacity:.68;line-height:1.7}.card{margin-top:30px;padding:clamp(24px,5vw,44px);border:1px solid #ffffff20;border-radius:26px;background:#ffffff08}.answers{display:grid;gap:12px;margin-top:20px}.answer{padding:16px;border:1px solid #ffffff20;border-radius:15px;background:#ffffff08;color:#fff;text-align:left;cursor:pointer}.answer:hover{background:#ffffff12}.meter{height:9px;background:#ffffff12;border-radius:99px;overflow:hidden;margin:20px 0}.meter span{display:block;height:100%;background:white}.hidden{display:none}.feedback{margin-top:18px;opacity:.7;line-height:1.6}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}</style></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">◌</span><span>TIDEFALL</span></a><nav class="nav-links"><a href="/explore">Explore</a><a href="/">Home</a></nav></header><main class="page"><div class="shell"><section class="hero"><p class="eyebrow">VOICE MAGIC</p><h1>Spell Trial</h1><p>Ten questions. Some are obvious. Some are there to catch people who click first and think later.</p></section><div class="meter"><span id="progress" style="width:0"></span></div><section id="quiz" class="card"><p id="num" class="eyebrow"></p><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" class="feedback hidden"></p></section><section id="result" class="card hidden"><p class="eyebrow">TRIAL COMPLETE</p><h2 id="rank"></h2><p id="copy"></p><div class="actions"><button id="again" class="button primary">Take it again</button><a class="button outline" href="/explore">Back to Explore</a></div></section></div></main><script>const qs=[{q:'How is magic normally cast in Tidefall?',a:[['With wands',0],['With hands and spoken magic',1],['Only through books',0],['Only underwater',0]]},{q:'Which spell is associated with light?',a:[['Veyra',1],['Tavra',0],['Raska',0],['Valka',0]]},{q:'Which spell is associated with pulling?',a:[['Sela',1],['Veyra',0],['Terva',0],['Raska',0]]},{q:'Tavra is associated with what?',a:[['Shielding',1],['Light',0],['Movement',0],['Dueling',0]]},{q:'Raska is most closely associated with...',a:[['Dueling',1],['Healing',0],['Light',0],['Unlocking',0]]},{q:'Valka is associated with...',a:[['Movement',1],['Shielding',0],['Silence',0],['Water breathing',0]]},{q:'If you find an unknown spell written in a hidden corridor, the smartest first move is...',a:[['Cast it immediately',0],['Study it without using it',1],['Shout it louder',0],['Assume it is harmless',0]]},{q:'What makes Tidefall magic distinct from a wand-based system?',a:[['The caster is directly involved',1],['Every spell needs a staff',0],['Only teachers can cast',0],['Magic never uses words',0]]},{q:'Which of these is NOT one of the known spell names shown on the site?',a:[['Veyra',0],['Sela',0],['Tavra',0],['Lumora',1]]},{q:'What does the site imply about its spell list?',a:[['Every spell is shown at once',0],['More spells exist than are immediately visible',1],['There are only five spells',0],['Spells are decorative only',0]]}];let i=0,score=0;function draw(){num.textContent=`QUESTION ${i+1} OF ${qs.length}`;question.textContent=qs[i].q;progress.style.width=`${i/qs.length*100}%`;answers.innerHTML='';feedback.classList.add('hidden');qs[i].a.forEach(([label,ok])=>{const b=document.createElement('button');b.className='answer';b.textContent=label;b.onclick=()=>{score+=ok;feedback.textContent=ok?'Correct. The Tide approves.':'Not quite.';feedback.classList.remove('hidden');[...answers.children].forEach(x=>x.disabled=true);setTimeout(()=>{i++;i<qs.length?draw():finish()},350)};answers.appendChild(b)})}function finish(){progress.style.width='100%';quiz.classList.add('hidden');result.classList.remove('hidden');localStorage.setItem('tidefall-spell-trial','1');if(score===10){rank.textContent='TIDE-SPEAKER';copy.textContent='Perfect score. Either you studied properly or the Academy should be mildly concerned.'}else if(score>=8){rank.textContent='SPELLWISE';copy.textContent=`${score}/10. Strong result. You know your way around Tidefall magic.`}else if(score>=5){rank.textContent='APPRENTICE';copy.textContent=`${score}/10. You know enough to be useful and just enough to be dangerous.`}else{rank.textContent='DO NOT CAST THAT';copy.textContent=`${score}/10. For everyone's sake, maybe read the spell before saying it out loud.`}}again.onclick=()=>{i=0;score=0;result.classList.add('hidden');quiz.classList.remove('hidden');draw()};draw();</script><script src="/quiz-back.js"></script></body></html>
