<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidefall Codebreaker | Tidefall</title><link rel="stylesheet" href="styles.css"><style>body{margin:0;background:#07131f;color:#fff}.p{padding:120px 20px}.s{max-width:760px;margin:auto;text-align:center}.card{padding:30px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08}.digits{display:flex;justify-content:center;gap:12px;margin:20px}.digits input{width:55px;padding:14px;text-align:center;font-size:1.5rem;background:#0b1b29;color:#fff;border:1px solid #ffffff22;border-radius:12px}.log{display:grid;gap:8px;margin-top:20px}.log div{padding:10px;background:#ffffff08;border-radius:10px}</style></head><body><main class="p"><div class="s"><p class="eyebrow">SEALED LOCK</p><h1>Codebreaker</h1><section class="card"><p>Crack the 4-digit Academy lock. After each guess, you’ll learn how many digits are correct and how many are in the correct position.</p><div class="digits"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"></div><button id="go" class="button primary">Test code</button><p id="status"></p><div id="log" class="log"></div></section></div></main><script>const code=Array.from({length:4},()=>Math.floor(Math.random()*10));let tries=0;go.onclick=()=>{let g=[...document.querySelectorAll('input')].map(x=>+x.value);if(g.some(Number.isNaN)){status.textContent='Enter four digits.';return}tries++;let pos=g.filter((v,i)=>v===code[i]).length;let a={};code.forEach(v=>a[v]=(a[v]||0)+1);let total=0;g.forEach(v=>{if(a[v]){total++;a[v]--}});log.insertAdjacentHTML('afterbegin',`<div>${g.join('')} · ${pos} exact · ${total-pos} misplaced</div>`);if(pos===4){status.textContent=`Unlocked in ${tries} tries.`;localStorage.setItem('tidefall-codebreaker',tries);go.disabled=true}else status.textContent='The lock holds.'}</script></body></html>
