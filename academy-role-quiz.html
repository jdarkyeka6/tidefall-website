<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131f"><title>What Role Would You Have at Tidefall Academy? | Tidefall</title><meta name="description" content="Take the Tidefall Academy role quiz and discover whether you would be the Scout, Strategist, Anchor or Wildcard."><link rel="canonical" href="https://www.tidefall.com.au/academy-role-quiz"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px 90px;background:#07131f;color:#fff}.shell{width:min(920px,100%);margin:auto}.card{padding:32px;border:1px solid #ffffff20;border-radius:24px;background:#ffffff08}.answers{display:grid;gap:12px}.answer{padding:17px;border:1px solid #ffffff20;border-radius:15px;background:#ffffff08;color:white;text-align:left;cursor:pointer}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}.stat{padding:14px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff06;text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">GROUP DYNAMICS</p><h1>What Role Would You Have at Tidefall Academy?</h1><section id="q" class="card"><p id="num"></p><h2 id="qt"></h2><div id="a" class="answers"></div></section><section id="r" class="card hidden"><p class="eyebrow">YOUR ROLE</p><h2 id="rn"></h2><p id="rc"></p><div id="stats" class="grid"></div><p><button id="again" class="button primary">Take it again</button> <a class="button outline" href="/relationships">Relationships</a></p></section></div></main><script>const meta={Scout:'You notice openings first, move early and are comfortable learning by going.',Strategist:'You turn confusion into a plan and usually think two steps past the obvious.',Anchor:'You keep people steady, notice who needs support and stop groups from falling apart.',Wildcard:'You create unexpected momentum, improvise well and are often the reason the group escapes a dead end.'};const qs=[['The group reaches a fork.',[['Check both paths quickly',{Scout:3,Wildcard:1}],['Compare risks and choose',{Strategist:3}],['Make sure nobody is separated',{Anchor:3}],['Pick the weird path',{Wildcard:3,Scout:1}]]],['Someone panics.',[['Check the area for danger',{Scout:2}],['Give them a clear next step',{Strategist:2,Anchor:1}],['Stay with them',{Anchor:3}],['Distract them long enough to move',{Wildcard:2,Anchor:1}]]],['A teacher gives a vague task.',[['Start investigating',{Scout:3}],['Define the objective',{Strategist:3}],['Make sure everyone understands',{Anchor:3}],['Turn it into something interesting',{Wildcard:3}]]],['What do you hate most?',[['Standing still',{Scout:3}],['Bad planning',{Strategist:3}],['People being left behind',{Anchor:3}],['Doing things the boring way',{Wildcard:3}]]],['A hidden route opens.',[['Go first',{Scout:3}],['Map it',{Strategist:3}],['Keep track of the group',{Anchor:3}],['See where it spits you out',{Wildcard:3}]]],['You get one tool.',[['Compass',{Scout:3}],['Notebook',{Strategist:3}],['Signal whistle',{Anchor:3}],['Mystery key',{Wildcard:3}]]],['A plan is failing.',[['Find a new path',{Scout:3}],['Rebuild the plan',{Strategist:3}],['Keep everyone calm',{Anchor:3}],['Do something nobody expected',{Wildcard:3}]]],['Which compliment fits best?',[['You spot things early',{Scout:3}],['You always have a plan',{Strategist:3}],['You make people feel safe',{Anchor:3}],['You make things happen',{Wildcard:3}]]],['You have to lead.',[['Lead from the front',{Scout:2,Anchor:1}],['Assign roles',{Strategist:3}],['Keep everyone together',{Anchor:3}],['Adapt constantly',{Wildcard:3}]]],['Final choice.',[['Explore',{Scout:3}],['Plan',{Strategist:3}],['Protect',{Anchor:3}],['Improvise',{Wildcard:3}]]]];let i=0,s={Scout:0,Strategist:0,Anchor:0,Wildcard:0};function draw(){num.textContent=`Question ${i+1} of ${qs.length}`;qt.textContent=qs[i][0];a.innerHTML='';qs[i][1].forEach(([label,p])=>{const b=document.createElement('button');b.className='answer';b.textContent=label;b.onclick=()=>{Object.entries(p).forEach(([k,v])=>s[k]+=v);i++;i<qs.length?draw():finish()};a.appendChild(b)})}function finish(){q.classList.add('hidden');r.classList.remove('hidden');const e=Object.entries(s).sort((a,b)=>b[1]-a[1]);rn.textContent=e[0][0].toUpperCase();rc.textContent=meta[e[0][0]];stats.innerHTML=e.map(([k,v])=>`<div class="stat"><strong>${k}</strong><br>${v}</div>`).join('');localStorage.setItem('tidefall-academy-role',e[0][0])}again.onclick=()=>{i=0;s={Scout:0,Strategist:0,Anchor:0,Wildcard:0};r.classList.add('hidden');q.classList.remove('hidden');draw()};draw();</script></body></html>
