<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidefall Riddle Room | Tidefall</title><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:white}.shell{width:min(850px,100%);margin:auto}.card{padding:32px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08}.answers{display:grid;gap:12px;margin-top:20px}.answer{padding:16px;border:1px solid #ffffff22;border-radius:14px;background:#ffffff08;color:white;text-align:left;cursor:pointer}.score{margin-top:18px;opacity:.65}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">THE RIDDLE ROOM</p><h1>Can You Outsmart the Academy?</h1><section class="card"><p id="n"></p><h2 id="q"></h2><div id="a" class="answers"></div><p id="f" class="score"></p></section></div></main><script>const qs=[['I move without feet and answer without a mouth. In Tidefall, what am I?',['The Tide','A bell','A key','A corridor'],0],['Which would be smartest before casting an unknown spell?',['Shout it louder','Study it first','Run','Ignore everyone'],1],['What can be stronger than speed in a maze?',['A map','Noise','Luck','Shoes'],0],['What does a locked door always tell you?',['Nothing','That someone locked it','It is dangerous','There is treasure'],1],['If a corridor changes, what matters first?',['Remembering where you came from','Running faster','Touching walls','Guessing'],0],['What grows when shared but shrinks when hidden?',['Knowledge','Water','Stone','Distance'],0],['What is safest to trust in a strange room?',['Evidence','Rumours','The loudest person','Nothing at all'],0],['What can reveal danger before you see it?',['Patterns','Speed','A joke','A coin'],0],['What gets better the more carefully you question it?',['A mystery','A wall','A shoe','A candle'],0],['What does Tidefall reward most here?',['Thinking','Guessing','Panic','Volume'],0]];let i=0,s=0;function draw(){n.textContent=`Riddle ${i+1} of ${qs.length}`;q.textContent=qs[i][0];a.innerHTML='';f.textContent=`Score ${s}`;qs[i][1].forEach((x,j)=>{const b=document.createElement('button');b.className='answer';b.textContent=x;b.onclick=()=>{if(j===qs[i][2])s++;i++;if(i<qs.length)draw();else{localStorage.setItem('tidefall-riddle','1');q.textContent=`You solved ${s}/${qs.length}`;a.innerHTML='<a class="button primary" href="/explore">Back to Explore</a>';n.textContent='RIDDLE COMPLETE';f.textContent=s>=8?'The Academy reluctantly approves.':'The Academy has notes.'}};a.appendChild(b)})}draw();</script><script src="/quiz-back.js"></script></body></html>
