<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131f"><title>Tide or Truth | Tidefall</title><meta name="description" content="Play Tide or Truth and guess whether strange Tidefall statements are true or invented."><link rel="canonical" href="https://www.tidefall.com.au/tide-or-truth"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px 90px;background:radial-gradient(circle at 50% 0%,rgba(80,145,170,.2),transparent 34%),#07131f;color:#fff}.shell{width:min(900px,100%);margin:auto}.card{padding:34px;border:1px solid #ffffff20;border-radius:26px;background:#ffffff09}.statement{font-family:Cinzel,serif;font-size:clamp(1.8rem,5vw,3.2rem);line-height:1.35}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.buttonx{padding:18px;border:1px solid #ffffff22;border-radius:16px;background:#ffffff08;color:white;font:inherit;cursor:pointer}.score{display:flex;justify-content:space-between;gap:12px;margin-bottom:20px;opacity:.7}.feedback{margin-top:18px;line-height:1.7}.hidden{display:none}@media(max-width:600px){.actions{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="brand" href="/">TIDEFALL</a><nav class="nav-links"><a href="/explore">Explore</a></nav></header><main class="page"><div class="shell"><p class="eyebrow">CAN YOU TELL?</p><h1>Tide or Truth</h1><p>Some statements are real Tidefall canon. Some are complete nonsense.</p><section class="card"><div class="score"><span id="round"></span><span>Score: <strong id="score">0</strong></span></div><div id="statement" class="statement"></div><div class="actions"><button id="truth" class="buttonx">Truth</button><button id="tide" class="buttonx">Made up</button></div><p id="feedback" class="feedback"></p></section></div></main><script>const q=[['Magic in Tidefall is cast without wands.',true,'Correct. Tidefall magic does not use wands.'],['All four main students are in Brannor.',true,'Correct. Jasper, Lily, Harper and Ava are all in Brannor.'],['Students choose their own Order.',false,'Nope. The Choosing Tide assigns students.'],['Nocten values independence, strategy and resolve.',true,'Correct.'],['Calyx values loud action above patience.',false,'No. Calyx is about patience, growth and careful understanding.'],['Astrae values imagination and curiosity.',true,'Correct.'],['Tidefall Academy has exactly four students total.',false,'Absolutely not 😭'],['The Tide can influence Order placement.',true,'Correct.'],['Brannor values courage, loyalty and action.',true,'Correct.'],['Every Tidefall spell requires a wand flourish.',false,'No wands here.']];let order=[...q].sort(()=>Math.random()-.5),i=0,s=0;function draw(){round.textContent=`${i+1} / ${order.length}`;statement.textContent=order[i][0];feedback.textContent=''}function choose(v){const ok=v===order[i][1];if(ok)s++;score.textContent=s;feedback.textContent=(ok?'✓ ':'✗ ')+order[i][2];truth.disabled=tide.disabled=true;setTimeout(()=>{i++;if(i<order.length){truth.disabled=tide.disabled=false;draw()}else{statement.textContent=`You scored ${s}/${order.length}`;feedback.textContent=s>=8?'The Academy is suspiciously impressed.':'Back into the archives with you.';document.querySelector('.actions').classList.add('hidden');localStorage.setItem('tidefall-tide-truth','1')}},650)}truth.onclick=()=>choose(true);tide.onclick=()=>choose(false);draw();</script><script src="/quiz-back.js"></script></body></html>
