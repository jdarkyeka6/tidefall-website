<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidefall Gift Finder</title><style>:root{--bg:#06131f;--p:#0b2231;--ink:#f7fbfc;--muted:#9eb7c2;--line:#ffffff20;--a:#e8f9fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#16435a,#06131f 48%);color:var(--ink);font-family:Inter,system-ui,sans-serif}button,a{font:inherit}a{color:inherit;text-decoration:none}.nav{padding:14px 5vw;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);background:#06131fee;position:sticky;top:0}.brand{font:700 1rem Georgia,serif;letter-spacing:.2em}.account{padding:9px 14px;border:1px solid var(--line);border-radius:999px}.wrap{max-width:1000px;margin:auto;padding:65px 20px}.hero{text-align:center}.eyebrow{font-size:.7rem;letter-spacing:.28em;color:#9bd0dc;font-weight:900}.hero h1{font:700 clamp(3rem,8vw,6rem)/.9 Georgia,serif;margin:18px 0}.hero p{color:var(--muted);line-height:1.7}.panel{margin-top:35px;background:#0b2231cc;border:1px solid var(--line);border-radius:25px;padding:25px}.q{padding:25px 0;border-bottom:1px solid var(--line)}.q h2{font:700 1.5rem Georgia,serif}.choices{display:flex;flex-wrap:wrap;gap:10px}.choice{padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:#ffffff08;color:var(--muted);cursor:pointer}.choice.on{background:var(--a);color:#06131f;font-weight:800}.results{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}.card{background:#102d3e;border:1px solid var(--line);border-radius:20px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#f4f0e8}.cardbody{padding:16px}.price{font-weight:900;margin-top:10px}.cta{display:block;margin-top:12px;padding:11px;text-align:center;background:var(--a);color:#06131f;border-radius:10px;font-weight:900}@media(max-width:700px){.results{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a class="brand" href="/">TIDEFALL</a><div><a href="/merch2.html">Shop</a> · <a class="account" href="/account.html">Account</a></div></nav><main class="wrap"><section class="hero"><div class="eyebrow">TIDEFALL MERCH</div><h1>FIND A GIFT</h1><p>Tell us who you're shopping for and we'll build a Tidefall shortlist. This is a demo experience while physical merch is still in development.</p></section><section class="panel"><div class="q"><h2>Who is it for?</h2><div class="choices" id="age"></div></div><div class="q"><h2>Favourite character?</h2><div class="choices" id="char"></div></div><div class="q"><h2>What's the budget?</h2><div class="choices" id="budget"></div></div></section><section><div class="results" id="results"></div></section></main><script>const IMG='https://raw.githubusercontent.com/jdarkyeka6/tidefall-website/main/assets/merch/';const s={age:'Teen',char:'Any',budget:100};const opts={age:['Kids','Teen','Adult'],char:['Any','Lily','Harper','Ava','Jasper','Tidefall'],budget:[30,50,75,100]};function draw(k){document.getElementById(k).innerHTML=opts[k].map(v=>`<button class="choice ${s[k]===v?'on':''}" onclick="pick('${k}',${typeof v==='number'?v:`'${v}'`})">${typeof v==='number'?'A$'+v:v}</button>`).join('')}function pick(k,v){s[k]=v;draw(k);drawResults()}function drawResults(){let all=[['Marshmallow Hoodie','Puffy Marshmallow design','hoodies.webp',29],['Character Tee','Choose Lily, Harper, Ava or Jasper','actual-merch.webp',19],['Character Shorts','Character clothing shorts','catalog.webp',25],['Academy Bag','Tidefall Academy bag','catalog.webp',29],['School Bottle','600–750 mL','catalog.webp',19],['Tidefall PJs','Ocean-blue Tidefall set','teens-pjs.webp',85]];let r=all.filter(x=>x[3]<=s.budget);if(s.char!=='Any')r=r.filter(x=>x[0].toLowerCase().includes(s.char.toLowerCase())||x[0].includes('Character')||x[0].includes('Tidefall')||x[0].includes('Marshmallow'));document.getElementById('results').innerHTML=r.map(x=>`<article class="card"><img src="${IMG+x[2]}" alt="${x[0]}"><div class="cardbody"><h3>${x[0]}</h3><p>${x[1]}</p><div class="price">A$${x[3]}</div><a class="cta" href="/merch2.html">View in shop →</a></div></article>`).join('')}Object.keys(opts).forEach(draw);drawResults();</script></body></html>
