<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tide Coin | Tidefall</title><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:#fff;text-align:center}.shell{width:min(720px,100%);margin:auto}.coin{width:190px;height:190px;border-radius:50%;margin:30px auto;display:grid;place-items:center;border:2px solid #ffffff44;background:#ffffff0a;font-family:Cinzel,serif;font-size:1.6rem;transition:.5s}.spin{transform:rotateY(720deg)}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">LET THE TIDE DECIDE</p><h1>Tide Coin</h1><div id="coin" class="coin">READY</div><button id="flip" class="button primary">Flip</button><p id="text"></p></div></main><script>flip.onclick=()=>{coin.classList.remove('spin');void coin.offsetWidth;coin.classList.add('spin');const x=Math.random()<.5?'GO':'WAIT';setTimeout(()=>{coin.textContent=x;text.textContent=x==='GO'?'The current says move.':'The current says not yet.';localStorage.setItem('tidefall-coin','1')},350)};</script></body></html>
