<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Tidefall Academy Companion | Tidefall</title><link rel="stylesheet" href="styles.css"><style>body{margin:0;background:#07131f;color:white}.p{padding:120px 20px}.s{max-width:800px;margin:auto;text-align:center}.card{padding:30px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08}.pet{font-size:5rem}.tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tag{padding:8px 12px;border:1px solid #ffffff22;border-radius:99px}</style></head><body><main class="p"><div class="s"><p class="eyebrow">ACADEMY COMPANION</p><h1>What Would Follow You Home?</h1><section class="card"><div id="pet" class="pet">🌊</div><h2 id="name">The Tide is deciding...</h2><p id="copy"></p><div id="tags" class="tags"></div><button id="go" class="button primary">Find my companion</button></section></div></main><script>const pets=[['Current Fox','🦊','Fast, nosy and always appears before something strange happens.',['Curious','Quick','Trouble']],['Glassfin','🐟','A tiny translucent fish that somehow survives outside water.',['Quiet','Odd','Loyal']],['Mist Owl','🦉','Shows up where it absolutely should not fit.',['Watchful','Calm','Secretive']],['Tide Pup','🐕','A damp, enthusiastic creature that steals socks and finds hidden doors.',['Friendly','Chaotic','Brave']],['Moon Crab','🦀','Collects shiny spell fragments and refuses to explain itself.',['Patient','Collector','Stubborn']]];go.onclick=()=>{let x=pets[Math.floor(Math.random()*pets.length)];pet.textContent=x[1];name.textContent=x[0];copy.textContent=x[2];tags.innerHTML=x[3].map(v=>`<span class="tag">${v}</span>`).join('');localStorage.setItem('tidefall-academy-pet',x[0])}</script></body></html>
