<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>This or That | Tidefall</title><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:#fff;text-align:center}.shell{width:min(800px,100%);margin:auto}.card{padding:30px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}.choice{padding:30px 18px;border:1px solid #ffffff22;border-radius:18px;background:#ffffff08;color:#fff;cursor:pointer;font-size:1.1rem}.count{opacity:.6;margin-bottom:16px}@media(max-width:600px){.choices{grid-template-columns:1fr}}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">THIS OR THAT</p><h1>Tidefall Edition</h1><section class="card"><p id="count" class="count"></p><div id="choices" class="choices"></div><p id="result"></p></section></div></main><script>const qs=[['Explore a hidden corridor','Ride a dolphin'],['Learn a new spell','Find a secret room'],['Train at Riptide','Study ancient magic'],['Go with Jasper','Go with Ava'],['Ask Lily','Ask Harper'],['Brannor common room','Nocten tower'],['Astrae workshop','Calyx garden'],['Night exploration','Early-morning exploration'],['Magic class','Creature studies'],['Locked box','Unmarked map'],['Choose courage','Choose strategy'],['Follow the Tide','Follow your instincts']];let i=0,left=0;function draw(){if(i>=qs.length){count.textContent='COMPLETE';choices.innerHTML='';result.textContent=`You picked the first option ${left} times out of ${qs.length}.`;localStorage.setItem('tidefall-this-that','1');return}count.textContent=`Choice ${i+1} of ${qs.length}`;choices.innerHTML='';qs[i].forEach((x,j)=>{const b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>{if(j===0)left++;i++;draw()};choices.appendChild(b)})}draw();</script></body></html>
