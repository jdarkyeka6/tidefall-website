<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131f"><title>What Is Your Tidefall Instinct? | Tidefall</title><meta name="description" content="Take the Tidefall instinct quiz and discover whether your strongest instinct is Protect, Explore, Understand or Command."><link rel="canonical" href="https://www.tidefall.com.au/tide-instinct-quiz"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px 90px;background:#07131f;color:white}.shell{width:min(920px,100%);margin:auto}.card{padding:32px;border:1px solid #ffffff20;border-radius:24px;background:#ffffff08}.answers{display:grid;gap:12px}.answer{padding:17px;border:1px solid #ffffff20;border-radius:15px;background:#ffffff08;color:white;text-align:left;cursor:pointer}.hidden{display:none}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip{padding:8px 12px;border:1px solid #ffffff20;border-radius:99px;background:#ffffff08}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">FIRST INSTINCT</p><h1>What Is Your Tidefall Instinct?</h1><section id="q" class="card"><p id="num"></p><h2 id="qt"></h2><div id="a" class="answers"></div></section><section id="r" class="card hidden"><p class="eyebrow">YOUR STRONGEST INSTINCT</p><h2 id="rn"></h2><p id="rc"></p><div id="chips" class="chips"></div><p><button id="again" class="button primary">Take it again</button> <a class="button outline" href="/explore">Explore more</a></p></section></div></main><script>const meta={Protect:{copy:'Your first instinct is to create safety, defend people and stop situations from getting worse.',traits:['Loyal','Steady','Protective']},Explore:{copy:'Your first instinct is to move toward the unknown and learn by discovering what is actually there.',traits:['Curious','Bold','Open']},Understand:{copy:'Your first instinct is to slow down, notice details and work out what something means before acting.',traits:['Patient','Perceptive','Thoughtful']},Command:{copy:'Your first instinct is to create direction, organise the situation and make the next move clear.',traits:['Strategic','Decisive','Focused']}};const qs=[['Something strange happens in class.',[['Check everyone is okay',{Protect:3}],['Get closer and investigate',{Explore:3}],['Watch for patterns',{Understand:3}],['Tell everyone what to do next',{Command:3}]]],['You hear a noise in a sealed corridor.',[['Make sure nobody goes alone',{Protect:3}],['Go see what it is',{Explore:3}],['Listen before moving',{Understand:3}],['Choose a route and lead',{Command:3}]]],['Your friend is upset.',[['Stay with them',{Protect:3}],['Get them somewhere different',{Explore:1,Protect:2}],['Ask what happened',{Understand:3}],['Help them decide what to do',{Command:2,Protect:1}]]],['You find a clue.',[['Keep it safe',{Protect:2}],['Follow it immediately',{Explore:3}],['Study it',{Understand:3}],['Use it to form a plan',{Command:3}]]],['Your team is stuck.',[['Keep morale together',{Protect:3}],['Try something new',{Explore:3}],['Re-check assumptions',{Understand:3}],['Assign next steps',{Command:3}]]],['Pick a verb.',[['Guard',{Protect:3}],['Discover',{Explore:3}],['Learn',{Understand:3}],['Lead',{Command:3}]]],['The Tide behaves oddly.',[['Move others to safety',{Protect:3}],['Follow the change',{Explore:3}],['Observe the current',{Understand:3}],['Choose the safest course',{Command:3}]]],['A mystery feels dangerous.',[['Protect people first',{Protect:3}],['Danger makes it more interesting',{Explore:3}],['Danger means more information is needed',{Understand:3}],['Danger means the plan needs structure',{Command:3}]]],['What do people need from you?',[['Support',{Protect:3}],['Energy',{Explore:2,Command:1}],['Insight',{Understand:3}],['Direction',{Command:3}]]],['Final instinct.',[['Shield',{Protect:3}],['Go',{Explore:3}],['Think',{Understand:3}],['Decide',{Command:3}]]]];let i=0,s={Protect:0,Explore:0,Understand:0,Command:0};function draw(){num.textContent=`Question ${i+1} of ${qs.length}`;qt.textContent=qs[i][0];a.innerHTML='';qs[i][1].forEach(([label,p])=>{const b=document.createElement('button');b.className='answer';b.textContent=label;b.onclick=()=>{Object.entries(p).forEach(([k,v])=>s[k]+=v);i++;i<qs.length?draw():finish()};a.appendChild(b)})}function finish(){q.classList.add('hidden');r.classList.remove('hidden');const e=Object.entries(s).sort((a,b)=>b[1]-a[1]);const w=e[0][0];rn.textContent=w.toUpperCase();rc.textContent=meta[w].copy;chips.innerHTML=meta[w].traits.map(x=>`<span class="chip">${x}</span>`).join('');localStorage.setItem('tidefall-instinct',w)}again.onclick=()=>{i=0;s={Protect:0,Explore:0,Understand:0,Command:0};r.classList.add('hidden');q.classList.remove('hidden');draw()};draw();</script><script src="/quiz-back.js"></script></body></html>
