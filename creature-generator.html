<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidefall Creature Generator</title><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:#fff}.shell{width:min(820px,100%);margin:auto}.card{padding:30px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08}.name{font-family:Cinzel,serif;font-size:clamp(2rem,7vw,4rem);margin:18px 0}.tags{display:flex;gap:10px;flex-wrap:wrap}.tag{padding:8px 12px;border:1px solid #ffffff22;border-radius:99px}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">CREATURE STUDIES</p><h1>Generate a Tidefall Creature</h1><section class="card"><div id="name" class="name">Unknown Creature</div><div id="tags" class="tags"></div><p id="desc">Generate something that probably lives too close to the Academy.</p><button id="gen" class="button primary">Generate creature</button></section></div></main><script>const p=a=>a[Math.floor(Math.random()*a.length)];const starts=['Tide','Glass','Hollow','Storm','Moon','Blue','Reef','Echo','Silver','Drift'];const ends=['fin','wisp','crawler','ray','ling','moth','serpent','hopper','eel','wing'];const habitats=['Academy waters','sea caves','flooded corridors','deep reefs','hidden pools'];const traits=['shy','curious','territorial','friendly until startled','impossible to predict'];gen.onclick=()=>{const n=p(starts)+p(ends);name.textContent=n;tags.innerHTML=`<span class="tag">${p(habitats)}</span><span class="tag">${p(traits)}</span>`;desc.textContent=`The ${n} is known for ${p(['following light spells','collecting shiny keys','copying footsteps','appearing before storms','vanishing when named'])}.`;localStorage.setItem('tidefall-creature-generator','1')};</script></body></html>
