<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Which Tidefall Character Are You? | Tidefall</title><meta name="description" content="Take the Tidefall character quiz and discover whether you are most like Jasper, Lily, Ava or Harper."><link rel="canonical" href="https://www.tidefall.com.au/character-quiz"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px 90px;background:#07131f;color:white}.shell{width:min(900px,100%);margin:auto}.card{padding:34px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff0a}.answers{display:grid;gap:12px}.answer{padding:16px;border:1px solid #ffffff22;border-radius:14px;background:#ffffff08;color:#fff;text-align:left;cursor:pointer}.hidden{display:none}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}</style></head><body><header class="site-header"><a class="brand" href="/">TIDEFALL</a></header><main class="page"><div class="shell"><p class="eyebrow">WHO ARE YOU IN THE TIDE?</p><h1>Which Tidefall Character Are You?</h1><section id="q" class="card"><p id="n"></p><h2 id="qt"></h2><div id="a" class="answers"></div></section><section id="r" class="card hidden"><p class="eyebrow">YOU ARE MOST LIKE</p><h2 id="rn"></h2><p id="rc"></p><div class="actions"><button id="again" class="button primary">Take it again</button><a class="button outline" href="/relationships">Relationship map</a><a class="button outline" href="/secrets">Secrets</a></div></section></div></main><script>const people={Jasper:'Protective, determined and willing to act when it matters.',Lily:'Thoughtful, resilient and stronger than people first realise.',Ava:'Practical, observant and usually already thinking three steps ahead.',Harper:'Bold, energetic and very good at turning chaos into momentum.'};const qs=[['A problem appears out of nowhere.',['Step in immediately','Think it through first','Check who needs help','Make everyone move']],['What do people rely on you for?',['Staying steady','Understanding things','Noticing details','Keeping energy up']],['Pick a strength.',['Courage','Resilience','Strategy','Confidence']],['A friend is stuck.',['Stand beside them','Listen properly','Find the solution','Get them moving']],['You enter a strange room.',['Check for danger','Notice how it feels','Inspect everything','Touch the weird thing']]];const map=[['Jasper','Ava','Lily','Harper'],['Jasper','Lily','Ava','Harper'],['Jasper','Lily','Ava','Harper'],['Jasper','Lily','Ava','Harper'],['Jasper','Lily','Ava','Harper']];let i=0,s={Jasper:0,Lily:0,Ava:0,Harper:0};function draw(){n.textContent=`Question ${i+1} of ${qs.length}`;qt.textContent=qs[i][0];a.innerHTML='';qs[i][1].forEach((x,j)=>{const b=document.createElement('button');b.className='answer';b.textContent=x;b.onclick=()=>{s[map[i][j]]++;i++;i<qs.length?draw():finish()};a.appendChild(b)})}function finish(){q.classList.add('hidden');r.classList.remove('hidden');const m=Math.max(...Object.values(s));const w=Object.keys(s).filter(k=>s[k]===m)[0];localStorage.setItem('tidefall-character-result',w);rn.textContent=w.toUpperCase();rc.textContent=people[w]}again.onclick=()=>{i=0;s={Jasper:0,Lily:0,Ava:0,Harper:0};r.classList.add('hidden');q.classList.remove('hidden');draw()};draw();</script></body></html>
