<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131f"><title>Which Tidefall Character Are You? | Tidefall</title><meta name="description" content="Take the 20-question Tidefall character quiz and discover whether you are most like Jasper Holloway, Lily Hart, Ava Rees or Harper Vale."><link rel="canonical" href="https://www.tidefall.com.au/character-quiz"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px 90px;background:radial-gradient(circle at 50% 0%,rgba(62,132,157,.18),transparent 30%),#07131f;color:white}.shell{width:min(980px,100%);margin:auto}.hero{text-align:center;margin-bottom:32px}.hero h1{font-family:Cinzel,serif;font-size:clamp(2.8rem,7vw,5.5rem);margin:10px 0 16px}.hero p{max-width:720px;margin:auto;opacity:.72;line-height:1.7}.progress{height:8px;border-radius:99px;overflow:hidden;background:#ffffff12;margin:26px 0}.progress>div{height:100%;background:linear-gradient(90deg,#6fd3ff,#fff);width:0;transition:.3s}.card{padding:clamp(24px,5vw,46px);border:1px solid #ffffff20;border-radius:28px;background:linear-gradient(180deg,#ffffff0d,#ffffff05);box-shadow:0 25px 80px #0005}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}.answer{padding:18px;border:1px solid #ffffff20;border-radius:16px;background:#ffffff08;color:#fff;text-align:left;cursor:pointer;font:inherit;transition:.2s}.answer:hover{transform:translateY(-2px);background:#ffffff12;border-color:#ffffff45}.hidden{display:none}.result{text-align:center}.portrait{width:150px;height:150px;border-radius:50%;object-fit:cover;border:1px solid #ffffff35;box-shadow:0 0 50px #6fd3ff22;margin:8px auto 18px}.traits{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0}.trait{padding:8px 12px;border:1px solid #ffffff20;border-radius:99px;background:#ffffff08;font-size:.85rem}.bars{margin:28px auto 0;max-width:600px;text-align:left}.barrow{display:grid;grid-template-columns:90px 1fr 42px;gap:10px;align-items:center;margin:10px 0}.bar{height:8px;background:#ffffff10;border-radius:99px;overflow:hidden}.bar>span{display:block;height:100%;background:#fff}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px}@media(max-width:700px){.answers{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">◌</span><span>TIDEFALL</span></a><nav class="nav-links"><a href="/">Home</a><a href="/house-quiz">House Quiz</a><a href="/relationships">Relationships</a><a href="/secrets">Secrets</a></nav></header><main class="page"><div class="shell"><section class="hero"><p class="eyebrow">WHO ARE YOU IN THE TIDE?</p><h1>Which Tidefall Character Are You?</h1><p>Answer twenty scenario questions. The quiz scores several traits, so one answer cannot decide the whole result.</p></section><div class="progress"><div id="progressBar"></div></div><section id="q" class="card"><p id="n" class="eyebrow"></p><h2 id="qt"></h2><div id="a" class="answers"></div></section><section id="r" class="card result hidden"><p class="eyebrow">YOU ARE MOST LIKE</p><img id="portrait" class="portrait" alt=""><h2 id="rn"></h2><div id="traits" class="traits"></div><p id="rc"></p><div id="bars" class="bars"></div><div class="actions"><button id="again" class="button primary">Take it again</button><a id="profileLink" class="button outline" href="#">View character</a><a class="button outline" href="/relationships">Relationship map</a><a class="button outline" href="/secrets">Secrets</a></div></section></div></main><script>const people={Jasper:{copy:'You are protective, steady under pressure and willing to act when something matters. You tend to carry responsibility before anyone asks you to.',traits:['Protective','Determined','Steady'],img:'/assets/jasper.png',url:'/characters/jasper'},Lily:{copy:'You are thoughtful, resilient and emotionally aware. You notice what other people miss and can keep going even when you are unsure of yourself.',traits:['Thoughtful','Resilient','Empathetic'],img:'/assets/lily.png',url:'/characters/lily'},Ava:{copy:'You are practical, observant and strategic. You like useful answers, notice patterns quickly and often become the person with the plan.',traits:['Practical','Observant','Strategic'],img:'/assets/ava.png',url:'/characters/ava'},Harper:{copy:'You are bold, energetic and adaptable. You create momentum, keep things moving and are good at making difficult situations feel possible.',traits:['Bold','Energetic','Adaptable'],img:'/assets/harper.png',url:'/characters/harper'}};const qs=[{q:'A problem appears out of nowhere. What do you do first?',a:[['Step in before it gets worse',{Jasper:2,Harper:1}],['Watch for what everyone else missed',{Ava:2,Lily:1}],['Check who is struggling most',{Lily:2,Jasper:1}],['Get everyone moving before panic spreads',{Harper:2,Jasper:1}]]},{q:'You are given a task nobody understands.',a:[['Take responsibility and start',{Jasper:2}],['Ask questions until it makes sense',{Lily:1,Ava:2}],['Break it into a system',{Ava:2}],['Try something and adjust fast',{Harper:2}]]},{q:'Which mistake annoys you most?',a:[['Leaving someone behind',{Jasper:2,Lily:1}],['Not listening properly',{Lily:2}],['Ignoring obvious evidence',{Ava:2}],['Freezing because the plan changed',{Harper:2}]]},{q:'You enter a strange room.',a:[['Check exits and danger first',{Jasper:2}],['Notice the feeling of the place',{Lily:2}],['Inspect objects and patterns',{Ava:2}],['Touch the weird thing',{Harper:2}]]},{q:'Your group is arguing.',a:[['Make sure nobody turns on each other',{Jasper:2}],['Hear everyone out',{Lily:2}],['Separate facts from assumptions',{Ava:2}],['Break the tension and get them moving',{Harper:2}]]},{q:'Pick the thing you value most.',a:[['Loyalty',{Jasper:2}],['Understanding',{Lily:2}],['Competence',{Ava:2}],['Courage',{Harper:2,Jasper:1}]]},{q:'A plan fails halfway through.',a:[['Protect the group and improvise',{Jasper:2,Harper:1}],['Slow down and understand why',{Lily:2,Ava:1}],['Recalculate immediately',{Ava:2}],['Change direction without wasting time',{Harper:2}]]},{q:'What do people probably notice about you first?',a:[['I take things seriously when it matters',{Jasper:2}],['I am quieter than people expect',{Lily:2}],['I notice details quickly',{Ava:2}],['I bring energy into the room',{Harper:2}]]},{q:'Someone dares you to do something stupid.',a:[['Only if it helps someone',{Jasper:2}],['Ask why they care so much',{Lily:2}],['Point out exactly why it is a bad idea',{Ava:2}],['Do the safer version and still make it fun',{Harper:2,Ava:1}]]},{q:'You have ten minutes before something important.',a:[['Check everyone is ready',{Jasper:2}],['Take a quiet moment to think',{Lily:2}],['Review the plan one more time',{Ava:2}],['Use the time to build confidence',{Harper:2}]]},{q:'Which role do you drift into in a group?',a:[['Protector',{Jasper:2}],['Listener',{Lily:2}],['Planner',{Ava:2}],['Motivator',{Harper:2}]]},{q:'You find a clue nobody else noticed.',a:[['Tell the group immediately',{Jasper:1,Lily:1}],['Think about what it might mean first',{Lily:2}],['Test whether it fits the evidence',{Ava:2}],['Use it to push the group forward',{Harper:2}]]},{q:'What is hardest for you?',a:[['Letting other people take the risk',{Jasper:2}],['Speaking before you feel ready',{Lily:2}],['Accepting a messy answer',{Ava:2}],['Staying patient when nothing is happening',{Harper:2}]]},{q:'A teacher gives vague instructions.',a:[['Make sure nobody gets stranded',{Jasper:2}],['Ask for clarification',{Lily:1,Ava:1}],['Infer the structure and proceed',{Ava:2}],['Start and adapt as you learn',{Harper:2}]]},{q:'Pick the kind of victory you prefer.',a:[['Everyone gets through safely',{Jasper:2}],['Someone feels understood',{Lily:2}],['The problem is completely solved',{Ava:2}],['The impossible thing actually works',{Harper:2}]]},{q:'You are under pressure and tired.',a:[['Keep going because others are depending on me',{Jasper:2}],['Slow down enough not to lose myself',{Lily:2}],['Reduce the problem to essentials',{Ava:2}],['Find a burst of energy and push through',{Harper:2}]]},{q:'A friend is hiding something.',a:[['Stay close until they are ready',{Jasper:1,Lily:1}],['Give them space but keep the door open',{Lily:2}],['Watch for what does not add up',{Ava:2}],['Try to get them talking without making it heavy',{Harper:2}]]},{q:'Which sentence feels most like you?',a:[['If it matters, I will be there.',{Jasper:2}],['There is usually more going on than people show.',{Lily:2}],['There is always a pattern if you look long enough.',{Ava:2}],['Standing still is rarely the answer.',{Harper:2}]]},{q:'You have to choose without enough information.',a:[['Choose the option that protects people',{Jasper:2}],['Choose the option that feels least harmful',{Lily:2}],['Choose the option with the best evidence',{Ava:2}],['Choose quickly and be ready to pivot',{Harper:2}]]},{q:'At the end of a difficult day, what matters most?',a:[['Everyone made it through',{Jasper:2}],['I stayed true to myself',{Lily:2}],['I understand more than I did before',{Ava:2}],['We kept moving instead of giving up',{Harper:2}]]}];let i=0,s={Jasper:0,Lily:0,Ava:0,Harper:0};function draw(){n.textContent=`QUESTION ${i+1} OF ${qs.length}`;qt.textContent=qs[i].q;progressBar.style.width=`${(i/qs.length)*100}%`;a.innerHTML='';qs[i].a.forEach(([label,pts])=>{const b=document.createElement('button');b.className='answer';b.textContent=label;b.onclick=()=>{Object.entries(pts).forEach(([k,v])=>s[k]+=v);i++;i<qs.length?draw():finish()};a.appendChild(b)})}function finish(){progressBar.style.width='100%';q.classList.add('hidden');r.classList.remove('hidden');const max=Math.max(...Object.values(s));const tied=Object.keys(s).filter(k=>s[k]===max);const w=tied.sort()[0];localStorage.setItem('tidefall-character-result',w);rn.textContent=w.toUpperCase();rc.textContent=people[w].copy;portrait.src=people[w].img;portrait.alt=w;profileLink.href=people[w].url;traits.innerHTML=people[w].traits.map(x=>`<span class="trait">${x}</span>`).join('');const total=Math.max(1,...Object.values(s));bars.innerHTML=Object.entries(s).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="barrow"><span>${k}</span><div class="bar"><span style="width:${Math.round(v/total*100)}%"></span></div><strong>${v}</strong></div>`).join('')}again.onclick=()=>{i=0;s={Jasper:0,Lily:0,Ava:0,Harper:0};r.classList.add('hidden');q.classList.remove('hidden');draw()};draw();</script><script src="/quiz-back.js"></script></body></html>
