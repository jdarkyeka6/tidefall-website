<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131f"><title>Explore Tidefall | Quizzes, Secrets, Maps & More</title><meta name="description" content="Explore Tidefall quizzes, daily discoveries, secrets, maps, mini-games, generators and interactive Academy activities."><link rel="canonical" href="https://www.tidefall.com.au/explore"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px 90px;background:radial-gradient(circle at 50% 0%,rgba(62,132,157,.18),transparent 32%),#07131f;color:white}.shell{width:min(1120px,100%);margin:auto}.hero{text-align:center}.hero h1{font-family:Cinzel,serif;font-size:clamp(3rem,8vw,6rem);margin:8px 0 14px}.hero p{max-width:780px;margin:auto;opacity:.7;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}.card{display:block;padding:24px;border:1px solid #ffffff20;border-radius:22px;background:linear-gradient(180deg,#ffffff0d,#ffffff05);color:white;text-decoration:none;transition:.2s;min-height:180px}.card:hover{transform:translateY(-3px);border-color:#ffffff55;background:#ffffff10}.card h2{font-family:Cinzel,serif;margin:8px 0}.card p{opacity:.66;line-height:1.6}.tag{font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;opacity:.5}.progressbox{margin-top:28px;padding:24px;border:1px solid #ffffff20;border-radius:22px;background:#ffffff08}.bar{height:10px;background:#ffffff12;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#fff;width:0}.muted{opacity:.6}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">◌</span><span>TIDEFALL</span></a><nav class="nav-links"><a href="/">Home</a><a href="/explore" aria-current="page">Explore</a><a href="/academy">Academy</a><a href="/books">Books</a></nav></header><main class="page"><div class="shell"><section class="hero"><p class="eyebrow">ENTER THE WORLD</p><h1>Explore Tidefall</h1><p>Quizzes, maps, mini-games, secrets, generators, collectibles and weird little pieces of the Academy. Your progress is saved on this device.</p></section><section class="progressbox"><p class="eyebrow">YOUR EXPLORATION</p><h2><span id="count">0</span> activities discovered</h2><div class="bar"><span id="bar"></span></div><p class="muted" id="status"></p></section><section class="grid" id="grid"></section></div></main><script>const items=[['House Quiz','Let the Choosing Tide decide which Order fits you.','/house-quiz','tidefall-house-result'],['Character Quiz','Find out whether you are most like Jasper, Lily, Ava or Harper.','/character-quiz','tidefall-character-result'],['Would You Survive?','Make decisions through a full day at Tidefall Academy.','/survive','tidefall-survive-complete'],['Daily Quote','Get the official quote of the day and draw extras from the Tide.','/quotes','visit-quotes'],['Daily Discovery','A new small Tidefall discovery every day.','/discover','tidefall-discovery-visited'],['Student ID','Generate your own Tidefall Academy student card.','/student-id','tidefall-student-id'],['Secrets','Unlock hidden currents by exploring the site.','/secrets','visit-secrets'],['Academy Map','Explore rooms, floors and hidden routes.','/map','tidefall-map-secret'],['Relationships','Explore the dynamics between the main four.','/relationships','visit-relationships'],['Orders','Learn about Brannor, Astrae, Calyx and Nocten.','/orders','visit-orders'],['Tidefall Facts','Pull random facts from the world.','/facts','visit-facts'],['Spell Trial','Test how well you know Tidefall magic.','/spell-trial','tidefall-spell-trial'],['Name Generator','Generate a Tidefall-style student identity.','/name-generator','tidefall-name-generator'],['Tide or Truth','Guess whether strange Tidefall statements are canon or invented.','/tide-or-truth','tidefall-tide-truth'],['Dolphin Dash','A tiny Riptide reflex game. Catch the dolphin before time runs out.','/dolphin-dash','tidefall-dolphin-dash'],['Decision Test','See how you make choices when Tidefall gets weird.','/decision-test','tidefall-decision-test'],['Spin the Tide','Spin for a random challenge, omen or page to explore.','/tide-spinner','tidefall-spinner'],['Academy Locker','Open your locker and collect random Tidefall items.','/locker','tidefall-locker'],['Match the Tide','Play a quick Tidefall memory matching game.','/memory','tidefall-memory'],['Ask the Tide','Ask a question and get a suspiciously vague Tidefall answer.','/fortune','tidefall-fortune']];const grid=document.getElementById('grid');let found=0;items.forEach(([name,desc,url,key])=>{const done=localStorage.getItem(key);if(done)found++;grid.insertAdjacentHTML('beforeend',`<a class="card" href="${url}"><span class="tag">${done?'Discovered':'Explore'}</span><h2>${name}</h2><p>${desc}</p></a>`)});count.textContent=found;bar.style.width=`${Math.round(found/items.length*100)}%`;status.textContent=found===items.length?'You have touched every current currently available.':`${items.length-found} activities remain undiscovered.`;localStorage.setItem('visit-explore','1');</script></body></html>
