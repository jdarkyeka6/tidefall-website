<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidefall Account</title><meta name="robots" content="noindex,nofollow,noarchive"><meta name="googlebot" content="noindex,nofollow,noarchive"><link rel="canonical" href="https://www.tidefall.com.au/account.html"><link rel="stylesheet" href="styles.css"><style>body{background:#06131e;color:#eef9ff;font-family:system-ui;margin:0}.acct{max-width:720px;margin:80px auto;padding:24px}.panel{background:#0b2030;border:1px solid #23475c;border-radius:20px;padding:24px}.tabs{display:flex;gap:10px;margin-bottom:18px}.tabs button,.acct button{padding:12px 18px;border-radius:999px;border:1px solid #3b718d;background:#123349;color:white;cursor:pointer}.field{display:grid;gap:7px;margin:14px 0}.field input{padding:13px;border-radius:12px;border:1px solid #31566b;background:#071924;color:white}.hidden{display:none}.status{min-height:24px;color:#bcecff}.profile-row{display:flex;justify-content:space-between;gap:12px;align-items:center}.back{color:#bcecff}</style></head><body><main class="acct"><a class="back" href="index.html">← Tidefall</a><h1>Your Tidefall Account</h1><div class="panel" id="authPanel"><div class="tabs"><button id="showLogin">Log in</button><button id="showSignup">Create account</button></div><form id="loginForm"><div class="field"><label>Email<input id="loginEmail" type="email" required autocomplete="email"></label></div><div class="field"><label>Password<input id="loginPassword" type="password" required autocomplete="current-password"></label></div><button>Log in</button><button type="button" id="forgotPassword">Forgot password?</button></form><form id="signupForm" class="hidden"><div class="field"><label>Username<input id="signupUsername" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" required autocomplete="username"></label></div><div class="field"><label>Display name<input id="signupDisplay" maxlength="40" required autocomplete="name"></label></div><div class="field"><label>Email<input id="signupEmail" type="email" required autocomplete="email"></label></div><div class="field"><label>Password<input id="signupPassword" type="password" minlength="8" required autocomplete="new-password"></label></div><button>Create account</button></form><p class="status" id="authStatus"></p></div><div class="panel hidden" id="profilePanel"><div class="profile-row"><div><p>Signed in as</p><h2 id="profileName"></h2><p id="profileEmail"></p></div><button id="logoutButton">Log out</button></div><hr><div class="field"><label>Display name<input id="editDisplay" maxlength="40"></label></div><div class="field"><label>Username<input id="editUsername" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+"></label></div><button id="saveProfile">Save profile</button><p class="status" id="profileStatus"></p><p><a class="back" href="wardrobe.html">Open Wardrobe →</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="account.js"></script></body></html>
