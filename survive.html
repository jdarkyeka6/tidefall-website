<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Would You Survive Tidefall Academy? | Tidefall</title><meta name="description" content="Make choices through a Tidefall Academy scenario and see whether you survive the day."><link rel="canonical" href="https://www.tidefall.com.au/survive"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:120px 20px 80px;background:#07131f;color:#fff}.shell{width:min(900px,100%);margin:auto}.card{padding:34px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff0a}.choices{display:grid;gap:12px}.choice{padding:16px;border:1px solid #ffffff22;border-radius:14px;background:#ffffff08;color:#fff;text-align:left;cursor:pointer}.hidden{display:none}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">WHAT WOULD YOU DO?</p><h1>Would You Survive Tidefall Academy?</h1><section id="game" class="card"><p id="step"></p><h2 id="scene"></h2><div id="choices" class="choices"></div></section><section id="result" class="card hidden"><p class="eyebrow">RESULT</p><h2 id="resultTitle"></h2><p id="resultCopy"></p><button id="again" class="button primary">Try again</button></section></div></main><script>const scenes=[{t:'A corridor starts filling with seawater even though there are no windows.',c:[['Run for the nearest stairs',2],['Stop and inspect where the water is moving',3],['Follow the current',1],['Shout for everyone nearby first',2]]},{t:'You hear your name from behind a locked classroom door.',c:[['Open it immediately',0],['Get a teacher',3],['Listen carefully before touching anything',3],['Walk away and pretend that was normal',1]]},{t:'Your friend disappears during a lesson change.',c:[['Search alone',1],['Tell someone and search with help',3],['Wait to see if they come back',1],['Check the places they always go first',2]]},{t:'The Choosing Tide suddenly pulls at you in the wrong direction.',c:[['Fight it without thinking',1],['Work out what changed',3],['Go with it and see what happens',2],['Grab onto something stable and reassess',3]]},{t:'You find a spell written somewhere it definitely should not be.',c:[['Cast it',0],['Memorise it for later',1],['Tell someone responsible',3],['Study it without using it',2]]}];let i=0,score=0;function draw(){step.textContent=`Scenario ${i+1} of ${scenes.length}`;scene.textContent=scenes[i].t;choices.innerHTML='';scenes[i].c.forEach(([label,pts])=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>{score+=pts;i++;i<scenes.length?draw():finish()};choices.appendChild(b)})}function finish(){game.classList.add('hidden');result.classList.remove('hidden');if(score>=13){resultTitle.textContent='YOU SURVIVE';resultCopy.textContent='You make careful choices, ask for help when it matters, and do not treat every mystery like a dare.'}else if(score>=8){resultTitle.textContent='PROBABLY';resultCopy.textContent='You survive, but Tidefall Academy has definitely written your name down somewhere.'}else{resultTitle.textContent='ABSOLUTELY NOT';resultCopy.textContent='You made several choices that the Academy would describe as educational for everyone watching.'}}again.onclick=()=>{i=0;score=0;result.classList.add('hidden');game.classList.remove('hidden');draw()};draw();</script></body></html>
