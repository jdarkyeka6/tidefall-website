<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131f"><title>Would You Survive Tidefall Academy? | Tidefall</title><meta name="description" content="Make choices through an interactive Tidefall Academy survival scenario and see how far you get."><link rel="canonical" href="https://www.tidefall.com.au/survive"><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px 90px;background:radial-gradient(circle at 50% 0%,rgba(58,126,151,.18),transparent 32%),#07131f;color:white}.shell{width:min(980px,100%);margin:auto}.hero{text-align:center;margin-bottom:28px}.hero h1{font-family:Cinzel,serif;font-size:clamp(2.8rem,7vw,5.3rem);margin:10px 0}.hero p{opacity:.7;max-width:720px;margin:auto;line-height:1.7}.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.hud div{padding:14px;border:1px solid #ffffff18;border-radius:16px;background:#ffffff08;text-align:center}.hud strong{display:block;font-size:1.35rem}.card{padding:clamp(24px,5vw,46px);border:1px solid #ffffff20;border-radius:28px;background:linear-gradient(180deg,#ffffff0d,#ffffff05);box-shadow:0 25px 80px #0005}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.choice{padding:18px;border:1px solid #ffffff20;border-radius:16px;background:#ffffff08;color:#fff;text-align:left;cursor:pointer;font:inherit;transition:.2s}.choice:hover{transform:translateY(-2px);background:#ffffff12}.feedback{margin-top:20px;padding:16px;border-left:3px solid #ffffff55;background:#ffffff08;line-height:1.6}.hidden{display:none}.result{text-align:center}.rank{font-family:Cinzel,serif;font-size:clamp(2.4rem,7vw,5rem);margin:8px 0}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}@media(max-width:700px){.choices,.hud{grid-template-columns:1fr}}</style></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">◌</span><span>TIDEFALL</span></a><nav class="nav-links"><a href="/">Home</a><a href="/discover">Discover</a><a href="/map">Map</a><a href="/secrets">Secrets</a></nav></header><main class="page"><div class="shell"><section class="hero"><p class="eyebrow">WHAT WOULD YOU DO?</p><h1>Would You Survive Tidefall Academy?</h1><p>Eight situations. Your choices affect three things: survival, judgement and how much chaos you leave behind.</p></section><div class="hud"><div><span>Survival</span><strong id="survival">50</strong></div><div><span>Judgement</span><strong id="judgement">50</strong></div><div><span>Chaos</span><strong id="chaos">0</strong></div></div><section id="game" class="card"><p id="step" class="eyebrow"></p><h2 id="scene"></h2><div id="choices" class="choices"></div><div id="feedback" class="feedback hidden"></div></section><section id="result" class="card result hidden"><p class="eyebrow">FINAL ASSESSMENT</p><div id="resultTitle" class="rank"></div><p id="resultCopy"></p><div class="actions"><button id="again" class="button primary">Try again</button><a class="button outline" href="/map">Explore the Academy map</a><a class="button outline" href="/secrets">Check secrets</a></div></section></div></main><script>const scenes=[{t:'A corridor starts filling with seawater even though there are no windows.',c:[['Run for the nearest stairs',{s:15,j:4,c:2,f:'Fast and useful. You get clear before the corridor becomes a canal.'}],['Stop and watch where the water is moving',{s:8,j:14,c:0,f:'You notice the current is flowing toward one wall instead of the stairs.'}],['Follow the current',{s:-10,j:-2,c:12,f:'Interesting choice. The Academy appreciates curiosity. Your shoes do not.'}],['Warn everyone nearby before moving',{s:10,j:10,c:0,f:'Good instinct. You buy other students time too.'}]]},{t:'You hear your name from behind a locked classroom door.',c:[['Open it immediately',{s:-18,j:-12,c:15,f:'The door was locked for a reason. The reason is now also your problem.'}],['Get a teacher',{s:12,j:15,c:-2,f:'Boring? Maybe. Alive? Extremely.'}],['Listen carefully before touching anything',{s:8,j:14,c:2,f:'The voice repeats your name with exactly the same timing. That is not normal.'}],['Walk away',{s:5,j:0,c:0,f:'You survive the hallway. You also never learn what was behind the door.'}]]},{t:'Your friend disappears during lesson change.',c:[['Search alone',{s:-4,j:-4,c:8,f:'Loyal, but now there are two students nobody can locate.'}],['Tell someone and search with help',{s:12,j:15,c:0,f:'You move quickly without turning the situation into a second emergency.'}],['Wait ten minutes',{s:-4,j:-8,c:0,f:'Ten minutes is a long time in a castle with impossible corridors.'}],['Check their usual places first',{s:7,j:9,c:1,f:'Efficient. You start with information instead of panic.'}]]},{t:'The Choosing Tide pulls at you in an unexpected direction.',c:[['Fight it immediately',{s:2,j:-5,c:6,f:'Determined, but you have not yet worked out what changed.'}],['Work out what changed first',{s:8,j:14,c:0,f:'You read the current before committing.'}],['Go with it',{s:4,j:2,c:7,f:'You may learn something. You may also learn it underwater.'}],['Grab something stable and reassess',{s:12,j:13,c:0,f:'Strong choice. Stability first, decision second.'}]]},{t:'You find a spell written somewhere it definitely should not be.',c:[['Cast it',{s:-20,j:-15,c:20,f:'You have invented a very efficient way to become a cautionary story.'}],['Memorise it',{s:0,j:1,c:6,f:'You did not cast it. That is the nicest thing available to say here.'}],['Tell someone responsible',{s:10,j:15,c:-2,f:'You treat unknown magic like unknown magic.'}],['Study it without using it',{s:6,j:10,c:2,f:'Curiosity without immediately detonating the corridor. Progress.'}]]},{t:'A dolphin appears in an Academy waterway and starts circling you.',c:[['Reach for it immediately',{s:2,j:-3,c:8,f:'Friendly confidence. Possibly too much confidence.'}],['Watch its behaviour first',{s:8,j:12,c:0,f:'You wait long enough to tell invitation from warning.'}],['Call someone who knows the waters',{s:10,j:12,c:0,f:'There is no prize for pretending expertise.'}],['Swim away fast',{s:5,j:0,c:3,f:'You survive. The dolphin looks personally offended.'}]]},{t:'A hidden corridor opens behind a wall and begins closing again.',c:[['Dive through',{s:-6,j:-5,c:11,f:'You found the hidden corridor. Unfortunately, the hidden corridor also found you.'}],['Mark the location and come back prepared',{s:9,j:14,c:0,f:'Future-you gets the mystery without present-you getting trapped.'}],['Hold it open and call friends',{s:6,j:6,c:4,f:'Teamwork, although the wall is winning the argument.'}],['Ignore it',{s:5,j:0,c:0,f:'Completely safe. Deeply unsatisfying.'}]]},{t:'The lights go out and the Tide starts whispering from somewhere below.',c:[['Run toward the whisper',{s:-12,j:-8,c:14,f:'Your survival strategy appears to be “meet the problem faster”.'}],['Stay with the group and find light',{s:14,j:13,c:-1,f:'You keep people together and restore visibility before moving.'}],['Listen for words or patterns',{s:5,j:11,c:2,f:'You learn something without committing to the dark.'}],['Use the nearest spell you know',{s:5,j:5,c:5,f:'Useful if it is the right spell. Less useful if it is not.'}]]}];let i=0,stats={s:50,j:50,c:0};function hud(){survival.textContent=Math.max(0,stats.s);judgement.textContent=Math.max(0,stats.j);chaos.textContent=Math.max(0,stats.c)}function draw(){step.textContent=`SCENARIO ${i+1} OF ${scenes.length}`;scene.textContent=scenes[i].t;choices.innerHTML='';feedback.classList.add('hidden');scenes[i].c.forEach(([label,o])=>{const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>choose(o);choices.appendChild(b)})}function choose(o){stats.s+=o.s;stats.j+=o.j;stats.c+=o.c;hud();feedback.textContent=o.f;feedback.classList.remove('hidden');[...choices.children].forEach(x=>x.disabled=true);setTimeout(()=>{i++;i<scenes.length?draw():finish()},450)}function finish(){game.classList.add('hidden');result.classList.remove('hidden');localStorage.setItem('tidefall-survive-complete','1');const score=stats.s+stats.j-stats.c;if(stats.s<=20){resultTitle.textContent='ACADEMY CASUALTY';resultCopy.textContent='Your choices were brave in several places and spectacularly questionable in several others. The Academy would remember you.'}else if(score>=160){resultTitle.textContent='TIDEWISE';resultCopy.textContent='You survive with strong judgement, low chaos and a suspiciously healthy respect for impossible water.'}else if(score>=115){resultTitle.textContent='SURVIVOR';resultCopy.textContent='You make it through. There are notes in at least one staff file, but you make it through.'}else{resultTitle.textContent='BARELY';resultCopy.textContent='You survive, technically. Tidefall Academy has several follow-up questions.'}}again.onclick=()=>{i=0;stats={s:50,j:50,c:0};hud();result.classList.add('hidden');game.classList.remove('hidden');draw()};hud();draw();</script></body></html>
