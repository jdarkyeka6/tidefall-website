<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidefall Mini Adventure | Tidefall</title><link rel="stylesheet" href="styles.css"><style>body{margin:0;background:#07131f;color:#fff}.p{padding:120px 20px}.s{max-width:850px;margin:auto}.card{padding:32px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08}.choices{display:grid;gap:12px;margin-top:20px}.choices button{padding:16px;border:1px solid #ffffff22;border-radius:14px;background:#ffffff08;color:#fff;text-align:left}.meta{opacity:.65}.hidden{display:none}</style></head><body><main class="p"><div class="s"><p class="eyebrow">A SMALL CURRENT</p><h1>The Door Below the Waterline</h1><section id="card" class="card"><p id="meta" class="meta"></p><h2 id="title"></h2><p id="copy"></p><div id="choices" class="choices"></div></section></div></main><script>const N={start:{t:'After lessons',c:'You notice a narrow stairwell behind a tapestry. Water glows faintly at the bottom.',o:[['Go down','water'],['Find a friend first','friend'],['Mark it and leave','leave']]},water:{t:'Below the stair',c:'The water reaches your ankles. A silver key lies beneath the surface while a door hums ahead.',o:[['Take the key','key'],['Ignore it and open the door','door'],['Go back','leave']]},friend:{t:'Not alone',c:'You return with backup. The stairwell is still there, but the glow is stronger.',o:[['Go together','key'],['Get a teacher instead','safe']]},key:{t:'The silver key',c:'The key is warm. The humming door now has a keyhole that definitely was not there before.',o:[['Use the key','secret'],['Pocket it and leave','keeper']]},door:{t:'The humming door',c:'The door opens without resistance. Behind it is only black water moving upward.',o:[['Step through','lost'],['Close it immediately','safe']]},secret:{t:'The hidden room',c:'A dry chamber appears beyond the door. On the wall: a map of corridors that do not exist on any Academy plan.',o:[['Memorise the map','map'],['Leave it untouched','safe']]},map:{t:'Ending: Cartographer',c:'You leave with several routes burned into memory. One of them seems to pass directly through your dorm wall.',o:[]},keeper:{t:'Ending: Keykeeper',c:'You leave with the key. It occasionally vibrates when you walk past certain walls.',o:[]},safe:{t:'Ending: Sensible',c:'You survive with excellent judgement and very few mysterious objects in your pockets.',o:[]},lost:{t:'Ending: Current-Chaser',c:'You emerge somewhere completely different, soaked, confused and carrying a shell you did not pick up.',o:[]},leave:{t:'Ending: Not Today',c:'You leave. The next morning, the tapestry is gone.',o:[]}};let node='start',steps=0;function draw(){let x=N[node];meta.textContent=`Step ${steps+1}`;title.textContent=x.t;copy.textContent=x.c;choices.innerHTML='';if(!x.o.length){localStorage.setItem('tidefall-mini-adventure',x.t);let b=document.createElement('button');b.textContent='Play again';b.onclick=()=>{node='start';steps=0;draw()};choices.appendChild(b);return}x.o.forEach(([l,n])=>{let b=document.createElement('button');b.textContent=l;b.onclick=()=>{node=n;steps++;draw()};choices.appendChild(b)})}draw();</script></body></html>
