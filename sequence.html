<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tide Sequence | Tidefall</title><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:#fff;text-align:center}.shell{width:min(700px,100%);margin:auto}.grid{display:grid;grid-template-columns:repeat(2,150px);gap:14px;justify-content:center;margin:28px 0}.pad{height:150px;border:1px solid #ffffff22;border-radius:22px;background:#ffffff08;cursor:pointer;font-size:2rem;color:white}.lit{background:#ffffff35;transform:scale(.96)}.muted{opacity:.65}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">MEMORY TRAINING</p><h1>Follow the Tide</h1><p class="muted">Repeat the growing sequence.</p><div id="grid" class="grid"><button class="pad" data-i="0">◌</button><button class="pad" data-i="1">✦</button><button class="pad" data-i="2">≈</button><button class="pad" data-i="3">◇</button></div><button id="start" class="button primary">Start</button><p id="status"></p></div></main><script>const pads=[...document.querySelectorAll('.pad')];let seq=[],pos=0,lock=true;const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function show(){lock=true;for(const x of seq){pads[x].classList.add('lit');await sleep(350);pads[x].classList.remove('lit');await sleep(180)}pos=0;lock=false;status.textContent=`Round ${seq.length}`};async function next(){seq.push(Math.floor(Math.random()*4));await show()}pads.forEach((p,i)=>p.onclick=()=>{if(lock)return;if(i!==seq[pos]){status.textContent=`Wrong. You reached round ${seq.length}.`;localStorage.setItem('tidefall-sequence',String(seq.length));lock=true;start.hidden=false;return}pos++;if(pos===seq.length){lock=true;setTimeout(next,500)}});start.onclick=()=>{seq=[];start.hidden=true;next()};</script></body></html>
