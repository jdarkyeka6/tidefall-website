<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#07131f"/>
  <title>Tidefall · Offline</title>
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0;background:#041019;color:#f4fbfd;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);padding:32px;border:1px solid rgba(255,255,255,.13);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));box-shadow:0 28px 90px rgba(0,0,0,.36)}.mark{width:52px;height:52px;border:1px solid rgba(150,231,246,.36);border-radius:50%;display:grid;place-items:center;color:#95e8f8;font-size:28px}small{display:block;margin-top:24px;color:#83dced;font-weight:800;letter-spacing:.18em}h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2.5rem,12vw,4.5rem);margin:8px 0 12px}p{color:#a9c2cb;line-height:1.65}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}a{min-height:48px;padding:0 18px;border-radius:999px;display:inline-flex;align-items:center;text-decoration:none;font-weight:800;background:#effcff;color:#06202b}.secondary{background:rgba(255,255,255,.055);color:#eaf8fb;border:1px solid rgba(255,255,255,.13)}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">≈</div>
    <small>THE TIDE WENT QUIET</small>
    <h1>You’re offline.</h1>
    <p>Pages you’ve already visited may still work. Reconnect to load anything new from Tidefall Academy.</p>
    <div class="actions"><a href="/">Try home</a><a class="secondary" href="/explore">Explore cached pages</a></div>
  </main>
</body>
</html>
