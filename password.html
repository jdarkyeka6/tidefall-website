<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secret Word | Tidefall</title><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:#fff}.shell{width:min(760px,100%);margin:auto}.card{padding:32px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08}.row{display:flex;gap:10px}.row input{flex:1;padding:14px;border-radius:12px;border:1px solid #ffffff22;background:#0c1c29;color:white}.msg{margin-top:18px;line-height:1.7;opacity:.75}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">SEALED CURRENT</p><h1>Find the Secret Word</h1><section class="card"><p>The Academy left three clues:</p><p>1. It is connected to the sea.<br>2. It can pull without hands.<br>3. Tidefall listens to it.</p><div class="row"><input id="guess" placeholder="Enter a word"><button id="tryBtn" class="button primary">Try</button></div><p id="msg" class="msg"></p></section></div></main><script>tryBtn.onclick=()=>{const g=guess.value.trim().toLowerCase();if(g==='tide'){localStorage.setItem('tidefall-password','1');msg.textContent='Unlocked. The Tide remembers that you found the word.'}else msg.textContent='No. The current closes again.'};</script></body></html>
