<!DOCTYPE html><html lang="en-AU"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spell Builder | Tidefall</title><link rel="stylesheet" href="styles.css"><style>.page{min-height:100svh;padding:130px 20px;background:#07131f;color:#fff}.shell{width:min(820px,100%);margin:auto}.card{padding:30px;border:1px solid #ffffff22;border-radius:24px;background:#ffffff08}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.row select{padding:14px;border-radius:12px;border:1px solid #ffffff22;background:#0d1f2d;color:#fff}.spell{font-family:Cinzel,serif;font-size:clamp(2rem,7vw,4.5rem);margin:24px 0}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main class="page"><div class="shell"><p class="eyebrow">SPELL FORGE</p><h1>Build a Tidefall Spell</h1><section class="card"><div class="row"><select id="power"><option>Light</option><option>Shield</option><option>Move</option><option>Reveal</option><option>Bind</option></select><select id="style"><option>Soft</option><option>Sharp</option><option>Wide</option><option>Focused</option><option>Wild</option></select><select id="source"><option>Tide</option><option>Voice</option><option>Hands</option><option>Memory</option></select></div><div id="spell" class="spell">VEYRA</div><p id="desc">A gentle light spell.</p><button id="make" class="button primary">Forge spell</button></section></div></main><script>const names=['Veyra','Sela','Tavra','Raska','Valka','Terva','Neyra','Sovar','Velka','Arin'];make.onclick=()=>{const n=names[Math.floor(Math.random()*names.length)];spell.textContent=n;desc.textContent=`A ${style.value.toLowerCase()} ${power.value.toLowerCase()} spell channelled through ${source.value.toLowerCase()}.`;localStorage.setItem('tidefall-spell-builder','1')};</script></body></html>
